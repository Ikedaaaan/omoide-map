<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AshiArt</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AshiArt">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{ --accent:#ff6b4a; --accent2:#ffb03b; --ink:#1f1a17; --sub:#7a6e66; --line:#eee3d8; --bg:#fff8f0; --ok:#2bb673;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif}
  #map{position:fixed;inset:0;background:#f2efe9}
  button{font-family:inherit}

  /* 上部 */
  .top{position:fixed;left:0;right:0;top:calc(var(--st) + 10px);z-index:500;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .pill{pointer-events:auto;background:rgba(255,255,255,.95);border-radius:999px;padding:9px 18px;font-weight:800;font-size:15px;
    box-shadow:0 3px 14px rgba(0,0,0,.14);border:none;color:var(--ink);max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill small{font-weight:600;color:var(--sub);margin-left:6px}
  .chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;max-width:100vw;padding:0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 11px;border-radius:999px;border:none;background:rgba(255,255,255,.95);font-size:13px;font-weight:700;
    box-shadow:0 2px 8px rgba(0,0,0,.1);color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff}

  /* 右側ボタン */
  .side{position:fixed;right:12px;top:calc(var(--st) + 110px);z-index:500;display:flex;flex-direction:column;gap:10px}
  .sbtn{width:46px;height:46px;border-radius:14px;border:none;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.16);font-size:21px}

  /* 下部ボタン */
  .bottom{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 18px);z-index:500;display:flex;justify-content:center;gap:16px;align-items:center}
  .bbtn{width:64px;height:64px;border-radius:18px;border:none;background:#111;color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .bbtn.add{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,#ff6b4a,#ffb03b);font-size:36px;font-weight:800}

  /* ピン */
  .mk{position:relative;width:52px;height:60px}
  .mk-in{position:absolute;left:3px;top:0;width:46px;height:46px;border-radius:50%;background:var(--c);border:3px solid #fff;
    box-shadow:0 3px 10px rgba(0,0,0,.3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
  .mk-in img{width:100%;height:100%;object-fit:cover}
  .mk-tail{position:absolute;left:21px;top:42px;width:10px;height:10px;background:#fff;transform:rotate(45deg);box-shadow:2px 2px 4px rgba(0,0,0,.2)}
  .mk-badge{position:absolute;right:-2px;top:-4px;width:22px;height:22px;border-radius:50%;background:#fff;font-size:13px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .mk-label{position:absolute;top:56px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;color:var(--ink);
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;max-width:140px;overflow:hidden;text-overflow:ellipsis}
  .far .mk-label{display:none}
  /* 現在地(whoo風：角丸アイコンの吹き出し＋向きの扇形) */
  .mepin-in{position:relative;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));transform-origin:50% 100%;animation:mepop .35s ease-out}
  .mepic{width:72px;height:72px;border-radius:24px;border:4px solid #2f7bff;background:#fff;overflow:hidden;box-sizing:border-box}
  .mepic .avatar{width:100%!important;height:100%!important;border-radius:0!important}
  .metail{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:13px solid #2f7bff;margin-top:-2px}
  /* 友達の現在地(白い縁) */
  .frpin-in{position:relative;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));cursor:pointer}
  .frpic{width:62px;height:62px;border-radius:21px;border:4px solid #fff;background:#fff;overflow:hidden;box-sizing:border-box}
  .frpic .avatar{width:100%!important;height:100%!important;border-radius:0!important}
  .frtail{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #fff;margin-top:-2px}
  /* ひとこと(インスタのノート風の吹き出し)と名前ラベル */
  .pnote{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);border-radius:16px;padding:6px 11px;
    font-size:12px;font-weight:700;line-height:1.35;width:max-content;max-width:150px;text-align:center;word-break:break-all;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .pnote:before{content:"";position:absolute;left:22px;bottom:-7px;width:11px;height:11px;border-radius:50%;background:#fff}
  .pnote:after{content:"";position:absolute;left:16px;bottom:-14px;width:6px;height:6px;border-radius:50%;background:#fff}
  .plabel{position:absolute;top:calc(100% + 2px);left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.2;
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
  .plabel b{display:block;font-size:12px;font-weight:900;color:var(--ink)}
  .plabel span{font-size:10px;font-weight:700;color:var(--sub)}
  .prof{text-align:center;padding-top:4px}
  .prof-av .avatar{border-radius:30px!important;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .prof-name{font-size:22px;font-weight:900;margin-top:10px}
  .prof-note{display:inline-block;margin-top:8px;background:#f6f1ec;border-radius:16px;padding:8px 14px;font-size:14px;color:var(--ink);max-width:90%}
  .prof-note small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
  .prof-note.empty{color:var(--sub)}
  .prof-row{margin-top:8px;font-size:13px;color:var(--sub)}
  .member{cursor:pointer}
  /* おもいでタイム */
  #realBar{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 112px);z-index:560;background:#111;color:#fff;border-radius:18px;padding:10px 10px 10px 16px;
    display:none;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  #realBar.show{display:flex}
  #realBar b{flex:1;font-size:14px}
  #realBar button{border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;padding:10px 14px;font-family:inherit}
  #bReal{position:relative}
  .rdot{position:absolute;right:6px;top:6px;width:10px;height:10px;border-radius:50%;background:#ff3b30;border:2px solid #fff;display:none}
  .rpin{position:relative;width:58px;height:58px;cursor:pointer}
  .rpic{width:58px;height:58px;border-radius:16px;border:3px solid #ffd60a;background:#222;overflow:hidden;box-sizing:border-box;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .rpic img{width:100%;height:100%;object-fit:cover;display:block}
  .rpic.blur img{filter:blur(8px)}
  .rbadge{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:#ffd60a;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .rl-card{margin-bottom:18px}
  .rl-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;flex-wrap:wrap}
  .rl-img{position:relative;border-radius:18px;overflow:hidden;background:#111;aspect-ratio:3/4;width:100%}
  .rl-img .bk{width:100%;height:100%;object-fit:cover;display:block}
  .rl-img .fr{position:absolute;left:10px;top:10px;width:30%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:2px solid #111}
  .rl-img.blur img{filter:blur(22px)}
  .rl-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-weight:700}
  .rl-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;padding:20px;background:rgba(0,0,0,.25)}
  .late{color:#d9443a;font-weight:800;font-size:12px}
  .ontime{color:#1f9d60;font-weight:800;font-size:12px}
  /* アルバム */
  .al-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .al-th{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;cursor:pointer;background:#f3ebe2}
  .al-add{aspect-ratio:1;border:2px dashed #e0cfbf;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;color:#c08a5c;cursor:pointer;font-weight:800}
  .al-add span{font-size:12px}
  .al-h{display:flex;align-items:baseline;gap:6px;margin-top:16px;font-weight:800;font-size:16px}
  #viewer{position:fixed;inset:0;z-index:1500;background:#000;display:none;flex-direction:column}
  #viewer.show{display:flex}
  #viewer .vtop{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 10px) 12px 10px;color:#fff;font-size:14px}
  #viewer .vtop #vInfo{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #viewer .vbtn{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:8px 12px;font-size:15px;font-family:inherit;font-weight:700}
  #viewer .vmid{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  #vImg{max-width:100%;max-height:100%;object-fit:contain}
  #vPrev,#vNext{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.25);color:#fff;font-size:22px}
  #vPrev{left:8px} #vNext{right:8px}
  /* 足あとモード */
  #bFoot.on{background:var(--accent);color:#fff}
  #footPanel{position:fixed;left:12px;top:calc(var(--st) + 110px);z-index:500;background:rgba(255,255,255,.95);border-radius:16px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-width:58%;display:none;font-size:13px}
  #footPanel.show{display:block}
  #footPanel b{font-size:14px}
  .fp-sub{color:#8a7d72;font-size:11px;margin:2px 0 4px}
  .fp-row{display:flex;align-items:center;gap:6px;margin-top:3px}
  .fp-dot{width:12px;height:12px;border-radius:50%;flex:none}
  .fp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fp-n{font-weight:800}
  /* おもいでタイムの振り返り(メモリーズ風) */
  #rhist{position:fixed;inset:0;z-index:880;background:#000;color:#fff;display:none;flex-direction:column}
  #rhist.show{display:flex}
  .rh-top{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 12px) 14px 8px}
  .rh-top b{flex:1;font-size:17px}
  .rh-x{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:38px;height:38px;font-size:17px}
  .rh-body{flex:1;overflow-y:auto;padding:0 4px calc(var(--sb) + 24px);-webkit-overflow-scrolling:touch}
  .rh-month{font-size:22px;font-weight:800;margin:20px 10px 10px}
  .rh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .rh-cell{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#1c1c1e;cursor:pointer}
  .rh-cell img{width:100%;height:100%;object-fit:cover;display:block}
  .rh-cell .d{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:500;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.75)}
  .rh-cell .lt{position:absolute;right:6px;bottom:6px;font-size:12px}
  .rh-note{text-align:center;color:#aaa;font-size:13px;margin:18px 0}
  .rtabs{display:flex;gap:6px;margin:4px 0 12px}
  .rtabs button{flex:1;border:none;border-radius:12px;padding:10px;font-weight:800;font-family:inherit;background:#f3ebe2;color:var(--ink)}
  .rtabs button.on{background:#111;color:#fff}
  .rday{font-weight:800;margin:14px 0 6px}
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .rcell{position:relative;cursor:pointer}
  .rcell img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:#222}
  .rcell.blur img{filter:blur(8px)}
  .rcell span{position:absolute;left:4px;bottom:4px;right:4px;font-size:11px;color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frpin-in.old{opacity:.6}
  .frpin-in.fuzzy .frpic{border-style:dashed}
  .mebase{position:relative;width:200px;height:200px;pointer-events:none}
  .mecone{position:absolute;inset:0;border-radius:50%;display:none;
    background:conic-gradient(from -35deg, rgba(47,123,255,.7) 0deg 70deg, transparent 70deg 360deg);
    -webkit-mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.75) 40%, transparent 71%);mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.75) 40%, transparent 71%)}
  .medot{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#2f7bff;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  @keyframes mepop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .avatar{border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex:none;background:#f3ebe2;box-sizing:border-box;vertical-align:middle;line-height:1}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .mk-who{position:absolute;left:-6px;top:-6px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex}
  .icgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .grow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:#faf6f2;margin-bottom:8px}
  .grow.cur{background:#fff1ec;outline:2px solid var(--accent)}
  .grow .gname{flex:1;min-width:0;font-weight:800;font-size:15px;border:none;background:none;text-align:left;padding:6px 0;color:var(--ink);font-family:inherit}
  .grow .gname small{display:block;font-weight:600;font-size:12px;color:var(--sub)}
  .grow .gleave{border:none;background:none;color:#c8372d;font-size:12px;font-weight:700;padding:8px;font-family:inherit}
  .icgrid button{width:42px;height:42px;border-radius:12px;border:2px solid transparent;background:#f6f1ec;font-size:22px}
  .icgrid button.on{border-color:var(--ink)}
  .mk{cursor:pointer}

  /* 位置決めモード */
  #pick{position:fixed;inset:0;z-index:600;pointer-events:none;display:none}
  #pick .cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:44px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
  #pick .msg{position:absolute;left:12px;right:12px;top:calc(var(--st) + 12px);background:#111;color:#fff;border-radius:14px;padding:12px;
    font-size:14px;text-align:center;line-height:1.5}
  #pick .acts{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 20px);display:flex;gap:10px;pointer-events:auto}

  /* シート */
  .ov{position:fixed;inset:0;z-index:900;background:rgba(20,12,6,.45);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(var(--sb) + 24px)}
  .sheet h2{margin:2px 0 12px;font-size:19px}
  label.f{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}
  input[type=text],input[type=date],input[type=search],input[type=password],textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);
    font-size:16px;font-family:inherit;background:#fffdfb}
  .hint{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.6}
  .hint.ok{color:var(--ok)} .hint.ng{color:#d9443a}
  .genres{display:flex;flex-wrap:wrap;gap:6px}
  .genres button{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--ink)}
  .genres button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rate button{font-size:30px;background:none;border:none;color:#e6dbcf;padding:0 2px}
  .rate button.on{color:var(--accent2)}
  .row{display:flex;gap:8px;margin-top:18px}
  .btn{flex:1;padding:13px;border-radius:14px;border:none;font-size:15px;font-weight:800;cursor:pointer}
  .btn.p{background:var(--accent);color:#fff} .btn.s{background:#f3ebe2;color:var(--ink)} .btn.d{background:#fde6e3;color:#c8372d}
  .btn.k{background:#111;color:#fff}
  .btn:disabled{opacity:.5}
  .photo{width:100%;max-height:340px;object-fit:cover;border-radius:16px;background:#f3ebe2;display:block}
  .meta{font-size:13px;color:var(--sub);margin:6px 0;line-height:1.7}
  .stars{color:var(--accent2);letter-spacing:1px}
  .note{white-space:pre-wrap;font-size:15px;line-height:1.7;background:var(--bg);border-radius:12px;padding:10px;margin-top:8px}
  a.gm{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:14px;background:#e8f4ff;color:#1a6fd1;font-weight:800;text-decoration:none}
  .item{display:flex;gap:10px;background:#fff;border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:0 1px 5px rgba(80,40,0,.1);
    border:none;width:100%;text-align:left;color:var(--ink);font:inherit}
  .thumb{width:64px;height:64px;border-radius:12px;flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:28px}
  .item .t{font-weight:800;font-size:15px} .item .m{font-size:12px;color:var(--sub);margin-top:3px}
  .pv{margin-top:8px;max-width:100%;max-height:170px;border-radius:12px;display:none}
  .member{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}

  /* 全画面(ログイン・グループ) */
  .screen{position:fixed;inset:0;z-index:1000;background:linear-gradient(160deg,#ff6b4a,#ffb03b);display:none;align-items:center;justify-content:center;padding:24px}
  .screen.show{display:flex}
  .card{background:#fff;border-radius:24px;padding:24px 20px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .card h1{margin:0 0 6px;font-size:24px} .card p{color:var(--sub);font-size:14px;line-height:1.7;margin:6px 0 0}
  .tabs2{display:flex;gap:6px;margin:16px 0 4px}
  .tabs2 button{flex:1;padding:9px;border-radius:999px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-weight:800}
  .tabs2 button.on{background:var(--accent);color:#fff}

  .toast{position:fixed;left:50%;bottom:calc(var(--sb) + 110px);transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;
    border-radius:12px;font-size:14px;z-index:2000;display:none;max-width:90%;text-align:center}
  .maplibregl-ctrl-attrib{font-size:9px}
  .maplibregl-ctrl-bottom-right{bottom:calc(var(--sb) + 0px)}
</style>
</head>
<body>
<div id="map"></div>

<div class="top" id="topUI" style="display:none">
  <button class="pill" id="pill">👣 AshiArt</button>
  <div class="chips" id="chips"></div>
</div>
<div class="side" id="sideUI" style="display:none">
  <button class="sbtn" id="bMembers" title="メンバー・招待">👥</button>
  <button class="sbtn" id="bSettings" title="設定">⚙️</button>
  <button class="sbtn" id="bCompass" title="向きを表示">🧭</button>
  <button class="sbtn" id="bFoot" title="足あとモード">👣</button>
  <button class="sbtn" id="bReal" title="おもいでタイム">📸<span class="rdot" id="rDot"></span></button>
</div>
<div class="bottom" id="bottomUI" style="display:none">
  <button class="bbtn" id="bList" title="一覧">🔍</button>

const GENRE_COLORS = ["#0ea5e9","#14b8a6","#a855f7","#f43f5e","#84cc16","#f97316","#6366f1","#d946ef"];
const cleanEmoji = e => (String(e||"").replace(/[<>&"'`\\]/g,"").slice(0,8) || "🏷️");
function applyGenres(){

function bindGenreChips(id, onPick){
  const box = $("#"+id);
  box.onclick = e=>{
    const b = e.target.closest("button"); if(!b) return;

    onPick(b.dataset.k); [...box.children].forEach(x=>x.classList.toggle("on", x===b));

// ---------- 地図 ----------
const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",
  center: [DEFAULT_CENTER[1], DEFAULT_CENTER[0]], zoom: 14,

map.touchZoomRotate.disableRotation();
// 地図の文字を日本語(現地名)で表示
map.on("load", ()=>{
  for(const ly of map.getStyle().layers){
    if(ly.type!=="symbol" || !ly.layout || !ly.layout["text-field"]) continue;
    if(!JSON.stringify(ly.layout["text-field"]).includes("name")) continue;
    try{ map.setLayoutProperty(ly.id, "text-field", ["coalesce", ["get","name:ja"], ["get","name"]]); }catch(_){}
  }
});
// Leafletと同じ感覚で使えるようにする小道具([緯度,経度]で受け取る)
function setView(ll, z){ map.jumpTo({ center:[ll[1], ll[0]], zoom: z }); }
function fitTo(pts){
  if(pts.length===1){ setView([pts[0].lat, pts[0].lng], 16); return; }
  const b = new maplibregl.LngLatBounds();
  pts.forEach(s=>b.extend([s.lng, s.lat]));
  map.fitBounds(b, { padding: 70, maxZoom: 16, duration: 0 });
}
function distM(a, b){ // 2点間の距離(m)
  const R=6371000, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
let markerObjs = [];
function updateFar(){ $("#map").classList.toggle("far", map.getZoom() < 15); }
map.on("zoom", updateFar); updateFar();

let meMarker = null, myPos = null, watchId = null;
function startLocate(pan){
  if(!navigator.geolocation){ toast("この端末では現在地が使えません"); return; }
  if(watchId===null){
    watchId = navigator.geolocation.watchPosition(p=>{
      myPos = [p.coords.latitude, p.coords.longitude];
      if(!meMarker) drawMe();
      else moveMe();
      sendLoc(false);
      recordTrail(p.coords.latitude, p.coords.longitude, p.coords.accuracy);
      if(pendingPan){ setView(myPos, Math.max(map.getZoom(),16)); pendingPan=false; }
    }, err=>{ toast(err.code===1 ? "位置情報の利用が許可されていません(ブラウザの設定を確認してね)" : "現在地を取得できませんでした"); pendingPan=false; },
    { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });
  }
  if(pan){ if(myPos){ setView(myPos, Math.max(map.getZoom(),16)); } else { pendingPan=true; } }
}
let pendingPan = false;
let meBase = null, heading = null;
function drawMe(){ // 現在地を自分のアイコンで表示(位置はこの端末の中だけで使い、送信しない)
  if(!myPos) return;
  if(meMarker){ meMarker.remove(); meMarker=null; }
  if(meBase){ meBase.remove(); meBase=null; }
  const ll = [myPos[1], myPos[0]];
  const base=document.createElement("div"); base.className="mebase";
  base.innerHTML = `<div class="mecone"></div><div class="medot"></div>`;
  meBase = new maplibregl.Marker({ element: base, rotationAlignment:"map", pitchAlignment:"map" }).setLngLat(ll).addTo(map);
  const el=document.createElement("div"); // 位置はMapLibreが外側の箱で管理するので、アニメは内側だけに付ける
  const mm = (me && members[me.uid]) || myProfileLS();
  el.innerHTML = `<div class="mepin-in">${noteActive(mm)?`<div class="pnote">${esc(mm.note)}</div>`:""}<div class="mepic">${avatarHTML(myself(), 64)}</div><div class="metail"></div></div>`;
  el.style.cursor = "pointer";
  el.addEventListener("click", e=>{ e.stopPropagation(); if(me && gid) openProfile(me.uid); });
  meMarker = new maplibregl.Marker({ element: el, anchor:"bottom", offset:[0,-6] }).setLngLat(ll).addTo(map);
  applyHeading();
}
function moveMe(){ const ll=[myPos[1], myPos[0]]; if(meMarker) meMarker.setLngLat(ll); if(meBase) meBase.setLngLat(ll); }
function applyHeading(){
  if(!meBase) return;
  const cone = meBase.getElement().querySelector(".mecone");
  if(heading==null){ cone.style.display="none"; return; }
  cone.style.display="block"; meBase.setRotation(heading);
}
// スマホの向き(コンパス)。iPhoneは許可が必要なので、◎を押したときに聞く
let orientOn = false;
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading==="number") h = e.webkitCompassHeading;
  else if(e.absolute && typeof e.alpha==="number") h = 360 - e.alpha;
  if(h==null) return;
  heading = Math.round(h); applyHeading();
}
async function startOrientation(){ // 戻り値: "on" | "denied" | "unsupported" | "error:..."
  if(orientOn) return "on";
  if(typeof DeviceOrientationEvent==="undefined") return "unsupported";
  try{
    if(typeof DeviceOrientationEvent.requestPermission==="function"){
      const r = await DeviceOrientationEvent.requestPermission(); // iPhoneはここで確認画面が出る
      if(r!=="granted") return "denied";
    }
    window.addEventListener("deviceorientationabsolute", onOrient);
    window.addEventListener("deviceorientation", onOrient);
    orientOn = true; return "on";
  }catch(e){ return "error:" + (e && e.message || e); }
}
$("#bCompass").onclick = async ()=>{
  const r = await startOrientation();
  if(r==="denied"){ toast("向きの利用が拒否されています。Safariのタブを閉じて開き直すと、もう一度聞かれます"); return; }
  if(r==="unsupported"){ toast("この端末・ブラウザは向きの表示に対応していません"); return; }
  if(r.startsWith("error:")){ toast("確認画面を出せませんでした(" + r.slice(6) + ")"); return; }
  if(!myPos) startLocate(true);
  setTimeout(()=>{ toast(heading==null ? "向きの情報がまだ届いていません。スマホを少し動かしてみてね" : `向きを表示中(${heading}°)`); }, 1500);
};
$("#bLocate").onclick = ()=>{ startOrientation(); startLocate(true); };

// ---------- グループ ----------
async function hashCode(code){
  const norm = "omoide:" + code.normalize("NFKC").trim().toLowerCase();
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,40);
}
function showGroupScreen(backTo){
  stopListening(); setMainUI(false);
  let mode = "join";
  const render = ()=>{
    showScreen(`<h1>👥 グループ</h1>
      <p>${esc(me.displayName||"")} さん、ようこそ！友達と同じ「合言葉」で同じ地図に入れます。</p>
      <div class="tabs2"><button data-m="join" class="${mode==="join"?"on":""}">参加する</button><button data-m="create" class="${mode==="create"?"on":""}">新しく作る</button></div>
      ${mode==="create" ? `<label class="f">グループ名</label><input type="text" id="gName" maxlength="30" placeholder="例：いつメン">` : ""}
      <label class="f">合言葉(8文字以上)</label>
      <input type="text" id="gCode" maxlength="60" autocomplete="off" autocapitalize="off" placeholder="${mode==="create"?"推測されにくい言葉にしてね":"友達から聞いた合言葉"}">
      <div class="hint">${mode==="create" ? "合言葉を知っている人は誰でも参加できます。短い言葉や名前は避けてね。" : ""}</div>
      <div class="row"><button class="btn p" id="gGo">${mode==="create"?"作成して入る":"参加する"}</button></div>
      <div class="row" style="margin-top:8px">${backTo?`<button class="btn s" id="gBack">戻る</button>`:""}<button class="btn s" id="gOut">ログアウト</button></div>`);
    document.querySelectorAll(".tabs2 button").forEach(b=>b.onclick=()=>{ mode=b.dataset.m; render(); });
    $("#gOut").onclick = ()=>signOut(auth);
    if(backTo) $("#gBack").onclick = ()=>enterGroup(backTo).catch(e=>toast(errMsg(e)));
    $("#gGo").onclick = async ()=>{
      const code = $("#gCode").value.trim();
      if(code.length < 8){ toast("合言葉は8文字以上にしてね"); return; }
      const btn=$("#gGo"); btn.disabled=true;
      try{
        const id = await hashCode(code);
        const ref = doc(db, "groups", id);
        const snap = await getDoc(ref);
        if(mode==="create"){
          if(snap.exists()){ toast("その合言葉はもう使われています。別の言葉にしてね"); btn.disabled=false; return; }
          const name = ($("#gName").value.trim() || "AshiArt").slice(0,30);
          await setDoc(ref, { name, createdBy: me.uid, createdAt: Date.now() });
        } else if(!snap.exists()){
          toast("その合言葉のグループが見つかりません"); btn.disabled=false; return;
        }
        LS.set("omoide.code."+id, code);
        await enterGroup(id);
      }catch(e){ toast(errMsg(e)); btn.disabled=false; }
    };
  };
  render();
}
async function enterGroup(id){
  const snap = await getDoc(doc(db,"groups",id));
  if(!snap.exists()) throw new Error("no group");
  // 自分をメンバーとして登録(既にいれば名前を更新)
  const mine = { name: me.displayName || "名無し", photo: me.photoURL || "", joinedAt: Date.now() };
  const ic = myIconLS(); if(ic) mine.icon = ic;   // 端末に保存したアイコンをこのグループにも反映
  const pf = myProfileLS(); for(const k of ["nick","bio","birthday","note","noteAt"]) if(pf[k]!==undefined) mine[k] = pf[k]; // プロフィールも反映
  await setDoc(doc(db,"groups",id,"members",me.uid), mine, { merge:true });
  gid = id; gname = snap.data().name || "AshiArt"; gcode = LS.get("omoide.code."+id) || "";
  try{ await setDoc(doc(db,"users",me.uid,"groups",id), { name: gname, joinedAt: Date.now() }, { merge:true }); }catch(_){}
  LS.set("omoide.gid", id);
  hideScreen(); setMainUI(true); startListening();
  if(new URLSearchParams(location.search).get("real")){ history.replaceState(null, "", location.pathname); setTimeout(()=>{ if(daily && daily.date===jstDate() && !postedToday()) openRealCapture(); else openRealFeed(); }, 1500); }

  if(shareMode()!=="off"){ startLocate(false); sendLoc(true); }

async function sendLoc(force){
  if(!gid || !me || !myPos) return;
  const mode = shareMode(); if(mode==="off") return;
  const now = Date.now();
  const moved = lastSent.t ? distM({lat:myPos[0],lng:myPos[1]}, {lat:lastSent.lat,lng:lastSent.lng}) : 1e9;
  if(!force && now-lastSent.t < 60000 && moved < 30) return;   // 1分に1回まで(30m以上動いたら即送る)
  let lat = myPos[0], lng = myPos[1];
  if(mode==="fuzzy"){ lat = Math.round(lat/0.005)*0.005; lng = Math.round(lng/0.006)*0.006; } // 約500m単位にぼかす
  lastSent = { t:now, lat:myPos[0], lng:myPos[1] };
  const body = { lat, lng, fuzzy: mode==="fuzzy", updatedAt: now };
  await Promise.all(allGroupIds().map(g=>setDoc(doc(db,"groups",g,"locs",me.uid), body).catch(()=>{})));   // 参加している全部のグループに送る
}

function readExifGps(buf){
  try{
    const v=new DataView(buf); if(v.byteLength<4||v.getUint16(0)!==0xFFD8) return null;
    let o=2;
    while(o+4<v.byteLength){
      const m=v.getUint16(o); if((m&0xFF00)!==0xFF00||m===0xFFDA) return null;
      const len=v.getUint16(o+2);
      if(m===0xFFE1 && o+10<v.byteLength && v.getUint32(o+4)===0x45786966){
        const t=o+10, le=v.getUint16(t)===0x4949, u16=p=>v.getUint16(p,le), u32=p=>v.getUint32(p,le);
        const ifd0=t+u32(t+4); let gps=0;
        for(let i=0;i<u16(ifd0);i++){ const e=ifd0+2+i*12; if(u16(e)===0x8825) gps=t+u32(e+8); }
        if(!gps) return null;
        const rat3=off=>{let r=[];for(let k=0;k<3;k++){const p=off+k*8,d=u32(p+4);r.push(d?u32(p)/d:0);}return r[0]+r[1]/60+r[2]/3600;};
        let latRef="N",lngRef="E",lat=null,lng=null;
        for(let i=0;i<u16(gps);i++){ const e=gps+2+i*12, tag=u16(e);
          if(tag===1) latRef=String.fromCharCode(v.getUint8(e+8)); else if(tag===3) lngRef=String.fromCharCode(v.getUint8(e+8));
          else if(tag===2) lat=rat3(t+u32(e+8)); else if(tag===4) lng=rat3(t+u32(e+8)); }
        if(lat==null||lng==null||!isFinite(lat)||!isFinite(lng)||(lat===0&&lng===0)) return null;
        if(latRef==="S") lat=-lat; if(lngRef==="W") lng=-lng;
        return {lat,lng};
      }
      o+=2+len;
    }
  }catch(_){}
  return null;
}
async function loadImage(file){
  const url=URL.createObjectURL(file);
  try{ return await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; }); }
  finally{ setTimeout(()=>URL.revokeObjectURL(url), 1000); }
}
function toDataURL(img, max, square, q){
  let sw=img.naturalWidth, sh=img.naturalHeight, sx=0, sy=0;
  if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
  const k=Math.min(1, max/Math.max(sw,sh));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(sw*k)); c.height=Math.max(1,Math.round(sh*k));
  c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
async function makePhotos(file){
  const img = await loadImage(file);
  let full = toDataURL(img, 1080, false, 0.72);
  if(full.length > 850000) full = toDataURL(img, 800, false, 0.6);   // Firestoreの1ドキュメント上限(約1MB)対策
  const thumb = toDataURL(img, 140, true, 0.7);
  return { full, thumb };
}

// ---------- 写真から作る(撮影場所を読み取ってアルバムを作る) ----------
// 写真の撮影日時(EXIF DateTimeOriginal)。読めなければ null
function readExifDate(buf){
  try{
    const v=new DataView(buf); if(v.byteLength<4||v.getUint16(0)!==0xFFD8) return null;
    let o=2;
    while(o+4<v.byteLength){
      const m=v.getUint16(o); if((m&0xFF00)!==0xFF00||m===0xFFDA) return null;
      const len=v.getUint16(o+2);
      if(m===0xFFE1 && o+10<v.byteLength && v.getUint32(o+4)===0x45786966){
        const t=o+10, le=v.getUint16(t)===0x4949, u16=p=>v.getUint16(p,le), u32=p=>v.getUint32(p,le);
        const ifd0=t+u32(t+4); let ex=0;
        for(let i=0;i<u16(ifd0);i++){ const e=ifd0+2+i*12; if(u16(e)===0x8769) ex=t+u32(e+8); }
        if(!ex) return null;
        for(let i=0;i<u16(ex);i++){ const e=ex+2+i*12; if(u16(e)===0x9003){ const p=t+u32(e+8); let s=""; for(let k=0;k<19;k++) s+=String.fromCharCode(v.getUint8(p+k));
          const mm=/^(\d{4}):(\d{2}):(\d{2})/.exec(s); return mm ? `${mm[1]}-${mm[2]}-${mm[3]}` : null; } }
        return null;
      }
      o+=2+len;
    }
  }catch(_){}
  return null;
}

    const withPos = [], noPos = [];

  });

// ---------- 👣 足あとモード(行った場所・歩いた道で地図を塗る) ----------
const FOOT_CELL = 0.0005;   // 約50mのマス
const FOOT_COLORS = ["#ff6b4a","#2f7bff","#2bb673","#a855f7","#ffb03b","#f43f5e","#14b8a6","#6366f1"];
let trails = {}, footOn = false, myTrailCells = new Set(), myTrailDay = null;
const trailOn = () => LS.get("omoide.trail") !== "off";
function memberColor(uid){
  const ic = members[uid] && members[uid].icon;
  if(ic && ic.color && /^#[0-9a-fA-F]{6}$/.test(ic.color)) return ic.color;
  let h = 0; for(const c of String(uid)) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return FOOT_COLORS[h % FOOT_COLORS.length];
}
const cellKey = (lat,lng) => (Math.round(lat/FOOT_CELL)*FOOT_CELL).toFixed(4) + "," + (Math.round(lng/FOOT_CELL)*FOOT_CELL).toFixed(4);
// アプリを開いている間、新しいマスに入ったら記録する(参加中の全グループ)
async function recordTrail(lat, lng, acc){
  if(!me || !gid || !trailOn() || (acc && acc > 80)) return;
  const d = jstDate(); if(d !== myTrailDay){ myTrailDay = d; myTrailCells = new Set(); }
  const k = cellKey(lat, lng); if(myTrailCells.has(k)) return; myTrailCells.add(k);
  for(const g of allGroupIds()){
    try{ await setDoc(doc(db,"groups",g,"trail",me.uid+"_"+d), { uid: me.uid, date: d, pts: arrayUnion(k), updatedAt: Date.now() }, { merge: true }); }catch(_){}
  }
}
function footFeatures(){
  const f = [];
  const add = (uid, lat, lng)=>{ if(typeof lat==="number" && typeof lng==="number" && isFinite(lat) && isFinite(lng)) f.push({ type:"Feature", properties:{ c: memberColor(uid) }, geometry:{ type:"Point", coordinates:[lng, lat] } }); };
  for(const t of Object.values(trails)) for(const k of (t.pts||[])){ const [a,b] = String(k).split(",").map(Number); add(t.uid, a, b); }
  spots.forEach(s=>add(s.createdBy, s.lat, s.lng));
  Object.values(reals).forEach(r=>add(r.uid, r.lat, r.lng));
  return { type:"FeatureCollection", features:f };
}
function ensureFootLayers(){
  if(!map.isStyleLoaded()) return false;
  if(!map.getSource("foot")){
    map.addSource("fog", { type:"geojson", data:{ type:"Feature", properties:{}, geometry:{ type:"Polygon", coordinates:[[[-180,-85],[180,-85],[180,85],[-180,85],[-180,-85]]] } } });
    map.addSource("foot", { type:"geojson", data: footFeatures() });
    map.addLayer({ id:"fog", type:"fill", source:"fog", layout:{ visibility:"none" }, paint:{ "fill-color":"#fff8ef", "fill-opacity":0.62 } });
    map.addLayer({ id:"foot", type:"circle", source:"foot", layout:{ visibility:"none" }, paint:{
      "circle-color":["get","c"], "circle-opacity":0.3, "circle-blur":0.55,
      "circle-radius":["interpolate",["exponential",2],["zoom"], 8,0.4, 20,1700] } });   // 半径およそ100m
  }
  return true;
}
function updateFoot(){
  if(!footOn) return;
  const src = map.getSource("foot"); if(src) src.setData(footFeatures());
  updateFootPanel();
}
function updateFootPanel(){
  const el = $("#footPanel"); if(!el || !footOn) return;
  const all = {}, month = {}; const m = jstDate().slice(0,7);
  const put = (o,u,k)=>{ (o[u] = o[u] || new Set()).add(k); };
  for(const t of Object.values(trails)) for(const k of (t.pts||[])){ put(all, t.uid, k); if((t.date||"").startsWith(m)) put(month, t.uid, k); }
  spots.forEach(s=>put(all, s.createdBy, cellKey(s.lat,s.lng)));
  Object.values(reals).forEach(r=>put(all, r.uid, cellKey(r.lat,r.lng)));
  const n = (o,u)=>o[u] ? o[u].size : 0;
  const uids = Object.keys(members).sort((a,b)=>n(all,b)-n(all,a));
  el.innerHTML = `<b>👣 足あとモード</b><div class="fp-sub">今月の自分：${n(month, me && me.uid)}マス</div>`
    + uids.map(u=>`<div class="fp-row"><span class="fp-dot" style="background:${memberColor(u)}"></span><span class="fp-name">${esc(who(u))}</span><span class="fp-n">${n(all,u)}</span></div>`).join("")
    + `<div class="fp-sub">${trailOn() ? "歩いた道とお店の周りが色付きます" : "歩いた道の記録はオフ(⚙️で変更)"}</div>`;
}
function setFoot(on){
  footOn = on;
  if(!ensureFootLayers()){ map.once("idle", ()=>setFoot(footOn)); return; }
  ["fog","foot"].forEach(id=>map.setLayoutProperty(id, "visibility", on ? "visible" : "none"));
  $("#bFoot").classList.toggle("on", on);
  $("#footPanel").classList.toggle("show", on);
  if(on){ updateFoot(); if(map.getZoom() > 15) map.easeTo({ zoom: 14 }); }
}
$("#bFoot").onclick = ()=>setFoot(!footOn);

const REAL_LIMIT = 2*60*1000;   // 2分を過ぎたら遅刻
const jstDate = (t=Date.now()) => new Date(t + 9*3600*1000).toISOString().slice(0,10);
let daily = null, dailyDate = null, unsubDaily = null, reals = {}, realMarkers = [];
const myRealId = () => jstDate() + "_" + (me ? me.uid : "");
const postedToday = () => !!(me && reals[myRealId()]);
function listenDaily(){
  const d = jstDate(); if(d === dailyDate && unsubDaily) return;
  if(unsubDaily){ try{unsubDaily()}catch(_){} }
  dailyDate = d; daily = null;
  unsubDaily = onSnapshot(doc(db,"daily",d), s=>{ daily = s.exists() ? s.data() : null; updateRealUI(); }, e=>{});
}
function stopDaily(){ if(unsubDaily){ try{unsubDaily()}catch(_){} unsubDaily=null; } daily=null; dailyDate=null; updateRealUI(); }
setInterval(()=>{ if(me && jstDate()!==dailyDate){ listenDaily(); drawReals(); } }, 60000);

function hhmm(t){ const d=new Date(t); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`; }
function mdText(date){ const m=/^\d{4}-(\d{2})-(\d{2})$/.exec(date||""); return m ? `${+m[1]}/${+m[2]}` : ""; }
const realHidden = r => r.date===jstDate() && me && r.uid!==me.uid && !postedToday();   // 自分が撮るまで今日の友達の投稿はぼかす

function drawReals(){
  realMarkers.forEach(m=>m.remove()); realMarkers=[];
  if(!me || (filter!=="all" && filter!=="real")) return;
  for(const r of Object.values(reals)){
    if(typeof r.lat!=="number" || typeof r.lng!=="number") continue;
    const el = document.createElement("div");
    el.innerHTML = `<div class="rpin"><div class="rpic${realHidden(r)?" blur":""}">${r.thumb?`<img src="${esc(r.thumb)}" alt="">`:""}</div><div class="rbadge">⚡</div>${members[r.uid]?`<div class="mk-who">${avatarHTML(members[r.uid],22)}</div>`:""}<div class="plabel"><b>${esc(who(r.uid))}</b><span>${mdText(r.date)} ${hhmm(r.at)}</span></div></div>`;
    el.addEventListener("click", e=>{ e.stopPropagation(); openReal(r.id); });
    realMarkers.push(new maplibregl.Marker({ element: el, anchor:"center" }).setLngLat([r.lng, r.lat]).addTo(map));
  }
}

// 下の帯(カウントダウン)と📸ボタンの赤丸
function updateRealUI(){
  const bar = $("#realBar"), dot = $("#rDot");
  if(!bar) return;
  const active = !!(me && gid && daily && daily.date===jstDate() && !postedToday());
  bar.classList.toggle("show", active);
  if(active){
    const left = REAL_LIMIT - (Date.now() - daily.at);
    $("#realText").textContent = left > 0
      ? `⚡ おもいでタイム！ 残り ${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,"0")}`
      : `⏰ おもいでタイム(${Math.ceil((-left)/60000)}分遅刻中)`;
  }
  const todays = Object.values(reals).filter(r=>r.date===jstDate() && me && r.uid!==me.uid).length;
  dot.style.display = (active || todays) ? "block" : "none";
}
setInterval(updateRealUI, 1000);

async function currentPos(){
  if(myPos) return { lat: myPos[0], lng: myPos[1] };
  return await new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p=>res({ lat:p.coords.latitude, lng:p.coords.longitude }), ()=>res(null), { enableHighAccuracy:true, timeout:10000, maximumAge:30000 });
  });
}

// 通知の登録(iPhoneはホーム画面に追加したアプリからのみ)
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
let fcm = null;
async function enablePush(){
  if(isIOS && !isStandalone()){ toast("先に「ホーム画面に追加」して、そこから開いてね"); return; }
  if(typeof Notification==="undefined"){ toast("この端末・ブラウザは通知に対応していません"); return; }
  const perm = await Notification.requestPermission();   // ボタンを押した直後に確認画面を出す
  if(perm !== "granted"){ toast("通知が許可されませんでした(設定 → 通知 から変えられます)"); return; }
  try{
    if(!(await isSupported())){ toast("この端末は通知に対応していません"); return; }
    const reg = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
    fcm = fcm || getMessaging(app);
    const token = await getToken(fcm, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token){ toast("通知の登録に失敗しました"); return; }
    const hb = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(token));
    const tid = [...new Uint8Array(hb)].slice(0,16).map(b=>b.toString(16).padStart(2,"0")).join("");
    await setDoc(doc(db,"users",me.uid,"push",tid), { token, createdAt: Date.now() });
    LS.set("omoide.push", tid);
    onMessage(fcm, ()=>{ listenDaily(); toast("⚡ おもいでタイム！ 下の帯から撮ってね"); });
    toast("🔔 通知をオンにしました");
  }catch(e){ toast("通知の登録に失敗しました(" + (e && (e.code||e.message) || e) + ")"); }
}
function pushStatusText(){
  if(isIOS && !isStandalone()) return "iPhoneでは、Safariの共有ボタン →「ホーム画面に追加」をして、ホーム画面のアイコンから開くと通知をオンにできます。";
  if(typeof Notification!=="undefined" && Notification.permission==="granted" && LS.get("omoide.push")) return "🔔 通知はオンです(毎日12〜21時のどこかで届きます)";
  return "毎日12〜21時のどこかで「⚡おもいでタイム」の通知が届きます。";
}

function myProfileLS(){ try{ return JSON.parse(LS.get("omoide.profile")||"{}"); }catch(_){ return {}; } }
const NOTE_MS = 24*3600*1000;
const noteActive = m => !!(m && m.note && Date.now() - (m.noteAt||0) < NOTE_MS);
function noteLeft(m){ const h = Math.ceil((NOTE_MS - (Date.now() - (m.noteAt||0))) / 3600000); return h <= 1 ? "あと1時間以内に消えます" : `あと${h}時間で消えます`; }
function bdayText(b){ const m = /^(\d{2})-(\d{2})$/.exec(b||""); if(!m) return ""; return `${+m[1]}月${+m[2]}日`; }
function isBdayToday(b){ const d=new Date(); return b === String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
async function saveProfile(fields){
  const p = Object.assign(myProfileLS(), fields);
  LS.set("omoide.profile", JSON.stringify(p));
  const ids = [...new Set([gid, ...Object.keys(myGroups)].filter(Boolean))];
  await setDoc(doc(db,"groups",gid,"members",me.uid), fields, { merge:true });
  await Promise.all(ids.filter(g=>g!==gid).map(g=>setDoc(doc(db,"groups",g,"members",me.uid), fields, { merge:true }).catch(()=>{})));
}

function openProfileEditor(){
  const p = Object.assign({}, myProfileLS(), members[me.uid] || {});
  const bd = /^(\d{2})-(\d{2})$/.exec(p.birthday||"");
  openSheet(`<h2>✏️ プロフィールを編集</h2>
    <label class="f">ニックネーム</label>
    <input type="text" id="eNick" maxlength="20" placeholder="${esc(me.displayName||"")}" value="${esc(p.nick||"")}">
    <div class="hint">空欄ならGoogleの名前が表示されます</div>
    <label class="f">誕生日(年は保存しません)</label>
    <div style="display:flex;gap:8px">
      <select id="eBm" style="flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);font-size:16px;background:#fffdfb"><option value="">月</option>${Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,"0")}" ${bd&&+bd[1]===i+1?"selected":""}>${i+1}月</option>`).join("")}</select>
      <select id="eBd" style="flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);font-size:16px;background:#fffdfb"><option value="">日</option>${Array.from({length:31},(_,i)=>`<option value="${String(i+1).padStart(2,"0")}" ${bd&&+bd[2]===i+1?"selected":""}>${i+1}日</option>`).join("")}</select>
    </div>
    <label class="f">自己紹介</label>
    <textarea id="eBio" rows="4" maxlength="200" placeholder="学部・好きな食べ物・よく行く場所 など">${esc(p.bio||"")}</textarea>
    <div class="row"><button class="btn s" id="eCancel">キャンセル</button><button class="btn p" id="eSave">保存する</button></div>`);
  $("#eCancel").onclick = ()=>openProfile(me.uid);
  $("#eSave").onclick = async ()=>{
    const m=$("#eBm").value, d=$("#eBd").value;
    if((m && !d) || (!m && d)){ toast("誕生日は月と日の両方を選んでね"); return; }
    $("#eSave").disabled = true;
    try{
      await saveProfile({ nick: $("#eNick").value.trim().slice(0,20), birthday: m&&d ? `${m}-${d}` : "", bio: $("#eBio").value.trim().slice(0,200) });
      toast("プロフィールを保存しました"); openProfile(me.uid);
    }catch(e){ toast(errMsg(e)); $("#eSave").disabled = false; }
  };
}

// ---------- メンバー・招待 ----------
$("#bMembers").onclick = ()=>{
  const list = Object.entries(members).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));
  openSheet(`<h2>👥 ${esc(gname)}</h2>
    ${list.map(([id,m])=>`<div class="member" data-uid="${esc(id)}">${avatarHTML(m,36)}<div><b>${esc(m.nick||m.name)}</b>${id===me.uid?"(あなた)":""}<div class="hint" style="margin:0">${noteActive(m)?esc(m.note)+" ・ ":""}${spots.filter(s=>s.createdBy===id).length}件の記録</div></div></div>`).join("")}
    <label class="f">友達を招待</label>
    ${gcode ? `<div class="hint">合言葉：<b>${esc(gcode)}</b></div><div class="row"><button class="btn p" id="inv">招待メッセージを送る</button></div>`
            : `<div class="hint">この端末には合言葉が保存されていません。合言葉を知っている人に聞いてね。</div>`}
    <div class="row"><button class="btn s" id="mClose">閉じる</button></div>`);
  $("#mClose").onclick=closeSheet;
  $("#sheet").querySelectorAll(".member").forEach(r=>r.onclick=()=>openProfile(r.dataset.uid));
  if(gcode) $("#inv").onclick=async()=>{
    const text = `AshiArt「${gname}」に参加してね！\n${location.origin+location.pathname}\n合言葉：${gcode}\n(LINEで開いたら「ブラウザで開く」を選んでね)`;
    try{ if(navigator.share){ await navigator.share({ text }); return; } }catch(_){ return; }
    try{ await navigator.clipboard.writeText(text); toast("招待メッセージをコピーしました"); }catch(_){ toast("コピーできませんでした"); }
  };
};

// ---------- 設定 ----------
$("#bSettings").onclick = ()=>{
  openSheet(`<h2>⚙️ 設定</h2>
    <div class="row" style="margin-top:0"><button class="btn p" id="sProfile">👤 自分のプロフィール</button></div>
    <label class="f">アイコン(グループのみんなに表示されます)</label>
    <div style="display:flex;align-items:center;gap:14px">
      <span id="icPrev">${avatarHTML(myself(),72)}</span>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <label class="btn p" style="text-align:center">📷 写真を選ぶ<input type="file" id="icFile" accept="image/*" hidden></label>
        <button class="btn s" id="icEmojiBtn">😀 絵文字にする</button>
        <button class="btn s" id="icGoogle">Googleの写真に戻す</button>
      </div>
    </div>
    <div id="icEmojiPanel" style="display:none">
      <div class="icgrid" id="icEmojis">${EMOJIS.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join("")}</div>
      <div class="icgrid" id="icColors">${ICON_COLORS.map(c=>`<button type="button" data-c="${c}" style="background:${c}" aria-label="色 ${c}"></button>`).join("")}</div>
      <div class="row"><button class="btn p" id="icEmojiOk">この絵文字にする</button></div>
    </div>
    <label class="f">🔔 おもいでタイムの通知</label>
    <div class="hint" id="pushStat">${pushStatusText()}</div>
    ${isIOS && !isStandalone() ? "" : `<div class="row" style="margin-top:8px"><button class="btn s" id="sPush">通知をオンにする</button></div>`}
    <label class="f">🏷️ グループのジャンル</label>
    <div id="sGenres">${customGenres.length ? customGenres.map(g=>`<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="flex:1">${esc(g.emoji)} ${esc(g.label)}</span>${g.createdBy===me.uid?`<button type="button" class="btn s" data-del="${esc(g.k)}" style="padding:6px 10px">削除</button>`:""}</div>`).join("") : `<div class="hint">まだありません。記録するときの「＋ 新しいジャンル」から追加できます。</div>`}</div>
    <label class="f">👣 歩いた道を足あとに残す</label>
    <div class="tabs2" id="trailSeg" style="margin-top:0"><button data-v="on">残す</button><button data-v="off">残さない</button></div>
    <div class="hint">アプリを開いている間に歩いた場所(約50mごと)を、参加しているグループの「足あとモード」に色として残します。</div>
    <label class="f">現在地の共有</label>
    <div class="tabs2" id="shareSeg" style="margin-top:0">
      <button data-v="off">共有しない</button><button data-v="on">共有する</button><button data-v="fuzzy">あいまい</button>
    </div>
    <div class="hint">参加しているすべてのグループのメンバーに見えます。アプリを開いている間だけ更新され、閉じると最後の場所が「〇分前」付きで残ります。「あいまい」は約500m単位のだいたいの場所になります。</div>
    <div class="meta" style="margin-top:16px">ログイン中：${esc(me.displayName||"")}<br>グループ：${esc(gname)}</div>
    <div class="row"><button class="btn s" id="sSwitch">グループを切り替える</button></div>
    <div class="row"><button class="btn s" id="sOut">ログアウト</button></div>
    <p class="hint" style="margin-top:16px">地図：© OpenStreetMap contributors © OpenFreeMap</p>
    <div class="row"><button class="btn s" id="sClose">閉じる</button></div>`);
  $("#sClose").onclick=closeSheet;
  $("#sProfile").onclick=()=>openProfile(me.uid);
  $("#sSwitch").onclick=()=>openGroupSheet();
  $("#sOut").onclick=async ()=>{ closeSheet(); await clearMyLocs(); LS.del("omoide.gid"); LS.del("omoide.icon"); LS.del("omoide.share"); LS.del("omoide.profile"); signOut(auth); };

  $("#sGenres").onclick = async e=>{
    const b = e.target.closest("button[data-del]"); if(!b) return;
    const g = G[b.dataset.del]; if(!g || !confirm(`ジャンル「${g.label}」を削除しますか？\nこのジャンルの記録は「その他」として表示されます。`)) return;
    try{ await deleteDoc(doc(db,"groups",gid,"genres",g.k.slice(2))); b.parentElement.remove(); toast("削除しました"); }catch(err){ toast(errMsg(err)); }
  };
  if($("#sPush")) $("#sPush").onclick = async ()=>{ await enablePush(); const el=$("#pushStat"); if(el) el.textContent = pushStatusText(); };
  const markTrail = ()=>[...$("#trailSeg").children].forEach(b=>b.classList.toggle("on", b.dataset.v===(trailOn()?"on":"off")));
  markTrail();
  $("#trailSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; LS.set("omoide.trail", b.dataset.v); markTrail(); updateFootPanel(); };
  const markShare = ()=>[...$("#shareSeg").children].forEach(b=>b.classList.toggle("on", b.dataset.v===shareMode()));
  markShare();
  $("#shareSeg").onclick = async e=>{
    const b = e.target.closest("button"); if(!b) return;
    LS.set("omoide.share", b.dataset.v); markShare();
    if(b.dataset.v==="off"){
      await clearMyLocs();
      toast("現在地の共有をやめました");
    } else {
      lastSent = { t:0, lat:0, lng:0 };
      startLocate(false); sendLoc(true);
      toast(b.dataset.v==="fuzzy" ? "だいたいの場所を共有します" : "現在地を共有します");
    }
  };
  const saveIcon = async (ic)=>{
    try{
      await setDoc(doc(db,"groups",gid,"members",me.uid), { icon: ic }, { merge:true });
      await Promise.all(Object.keys(myGroups).filter(g=>g!==gid).map(g=>setDoc(doc(db,"groups",g,"members",me.uid), { icon: ic }, { merge:true }).catch(()=>{})));
      LS.set("omoide.icon", JSON.stringify(ic));
      $("#icPrev").innerHTML = avatarHTML(myself(),72);
      drawMe(); toast("アイコンを変更しました");
    }catch(e){ toast(errMsg(e)); }
  };
  $("#icFile").addEventListener("change", async e=>{
    const file = e.target.files && e.target.files[0]; if(!file) return;
    try{
      const img = await loadImage(file);
      let data = toDataURL(img, 160, true, 0.8);
      if(data.length > 55000) data = toDataURL(img, 120, true, 0.7);
      await saveIcon({ type:"photo", data });
    }catch(_){ toast("この写真は読み込めませんでした(JPEGで試してね)"); }
  });
  $("#icGoogle").onclick = ()=>saveIcon({ type:"google" });
  const cur = myIconLS() || {};
  let pickE = cur.emoji || EMOJIS[0], pickC = cur.color || ICON_COLORS[1];
  const mark = ()=>{
    [...$("#icEmojis").children].forEach(b=>b.classList.toggle("on", b.dataset.e===pickE));
    [...$("#icColors").children].forEach(b=>b.classList.toggle("on", b.dataset.c===pickC));
  };
  $("#icEmojiBtn").onclick = ()=>{ $("#icEmojiPanel").style.display="block"; mark(); };
  $("#icEmojis").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; pickE=b.dataset.e; mark(); };
  $("#icColors").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; pickC=b.dataset.c; mark(); };
  $("#icEmojiOk").onclick = ()=>saveIcon({ type:"emoji", emoji:pickE, color:pickC });
};
</script>
</body>
</html>
