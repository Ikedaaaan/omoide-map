<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>おもいでマップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{ --accent:#ff6b4a; --accent2:#ffb03b; --ink:#1f1a17; --sub:#7a6e66; --line:#eee3d8; --bg:#fff8f0; --ok:#2bb673;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif}
  #map{position:fixed;inset:0;background:#f2efe9}
  button{font-family:inherit}

  /* 上部 */
  .top{position:fixed;left:0;right:0;top:calc(var(--st) + 10px);z-index:500;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .pill{pointer-events:auto;background:rgba(255,255,255,.95);border-radius:999px;padding:9px 18px;font-weight:800;font-size:15px;
    box-shadow:0 3px 14px rgba(0,0,0,.14);border:none;color:var(--ink);max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill small{font-weight:600;color:var(--sub);margin-left:6px}
  .chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;max-width:100vw;padding:0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 11px;border-radius:999px;border:none;background:rgba(255,255,255,.95);font-size:13px;font-weight:700;
    box-shadow:0 2px 8px rgba(0,0,0,.1);color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff}

  /* 右側ボタン */
  .side{position:fixed;right:12px;top:calc(var(--st) + 110px);z-index:500;display:flex;flex-direction:column;gap:10px}
  .sbtn{width:46px;height:46px;border-radius:14px;border:none;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.16);font-size:21px}

  /* 下部ボタン */
  .bottom{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 18px);z-index:500;display:flex;justify-content:center;gap:16px;align-items:center}
  .bbtn{width:64px;height:64px;border-radius:18px;border:none;background:#111;color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .bbtn.add{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,#ff6b4a,#ffb03b);font-size:36px;font-weight:800}

  /* ピン */
  .mk{position:relative;width:52px;height:60px}
  .mk-in{position:absolute;left:3px;top:0;width:46px;height:46px;border-radius:50%;background:var(--c);border:3px solid #fff;
    box-shadow:0 3px 10px rgba(0,0,0,.3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
  .mk-in img{width:100%;height:100%;object-fit:cover}
  .mk-tail{position:absolute;left:21px;top:42px;width:10px;height:10px;background:#fff;transform:rotate(45deg);box-shadow:2px 2px 4px rgba(0,0,0,.2)}
  .mk-badge{position:absolute;right:-2px;top:-4px;width:22px;height:22px;border-radius:50%;background:#fff;font-size:13px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .mk-label{position:absolute;top:56px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;color:var(--ink);
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;max-width:140px;overflow:hidden;text-overflow:ellipsis}
  .far .mk-label{display:none}
  /* 現在地(whoo風：角丸アイコンの吹き出し＋向きの扇形) */
  .mepin-in{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));transform-origin:50% 100%;animation:mepop .35s ease-out}
  .mepic{width:72px;height:72px;border-radius:24px;border:4px solid #2f7bff;background:#fff;overflow:hidden;box-sizing:border-box}
  .mepic .avatar{width:100%!important;height:100%!important;border-radius:0!important}
  .metail{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:13px solid #2f7bff;margin-top:-2px}
  .mebase{position:relative;width:200px;height:200px;pointer-events:none}
  .mecone{position:absolute;inset:0;border-radius:50%;display:none;
    background:conic-gradient(from -35deg, rgba(47,123,255,.7) 0deg 70deg, transparent 70deg 360deg);
    -webkit-mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.75) 40%, transparent 71%);mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.75) 40%, transparent 71%)}
  .medot{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#2f7bff;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  @keyframes mepop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .avatar{border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex:none;background:#f3ebe2;box-sizing:border-box;vertical-align:middle;line-height:1}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .mk-who{position:absolute;left:-6px;top:-6px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex}
  .icgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .icgrid button{width:42px;height:42px;border-radius:12px;border:2px solid transparent;background:#f6f1ec;font-size:22px}
  .icgrid button.on{border-color:var(--ink)}
  .mk{cursor:pointer}

  /* 位置決めモード */
  #pick{position:fixed;inset:0;z-index:600;pointer-events:none;display:none}
  #pick .cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:44px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
  #pick .msg{position:absolute;left:12px;right:12px;top:calc(var(--st) + 12px);background:#111;color:#fff;border-radius:14px;padding:12px;
    font-size:14px;text-align:center;line-height:1.5}
  #pick .acts{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 20px);display:flex;gap:10px;pointer-events:auto}

  /* シート */
  .ov{position:fixed;inset:0;z-index:900;background:rgba(20,12,6,.45);display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(var(--sb) + 24px)}
  .sheet h2{margin:2px 0 12px;font-size:19px}
  label.f{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}
  input[type=text],input[type=date],input[type=search],input[type=password],textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);
    font-size:16px;font-family:inherit;background:#fffdfb}
  .hint{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.6}
  .hint.ok{color:var(--ok)} .hint.ng{color:#d9443a}
  .genres{display:flex;flex-wrap:wrap;gap:6px}
  .genres button{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--ink)}
  .genres button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rate button{font-size:30px;background:none;border:none;color:#e6dbcf;padding:0 2px}
  .rate button.on{color:var(--accent2)}
  .row{display:flex;gap:8px;margin-top:18px}
  .btn{flex:1;padding:13px;border-radius:14px;border:none;font-size:15px;font-weight:800;cursor:pointer}
  .btn.p{background:var(--accent);color:#fff} .btn.s{background:#f3ebe2;color:var(--ink)} .btn.d{background:#fde6e3;color:#c8372d}
  .btn.k{background:#111;color:#fff}
  .btn:disabled{opacity:.5}
  .photo{width:100%;max-height:340px;object-fit:cover;border-radius:16px;background:#f3ebe2;display:block}
  .meta{font-size:13px;color:var(--sub);margin:6px 0;line-height:1.7}
  .stars{color:var(--accent2);letter-spacing:1px}
  .note{white-space:pre-wrap;font-size:15px;line-height:1.7;background:var(--bg);border-radius:12px;padding:10px;margin-top:8px}
  a.gm{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:14px;background:#e8f4ff;color:#1a6fd1;font-weight:800;text-decoration:none}
  .item{display:flex;gap:10px;background:#fff;border-radius:16px;padding:10px;margin-bottom:10px;box-shadow:0 1px 5px rgba(80,40,0,.1);
    border:none;width:100%;text-align:left;color:var(--ink);font:inherit}
  .thumb{width:64px;height:64px;border-radius:12px;flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:28px}
  .item .t{font-weight:800;font-size:15px} .item .m{font-size:12px;color:var(--sub);margin-top:3px}
  .pv{margin-top:8px;max-width:100%;max-height:170px;border-radius:12px;display:none}
  .member{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}

  /* 全画面(ログイン・グループ) */
  .screen{position:fixed;inset:0;z-index:1000;background:linear-gradient(160deg,#ff6b4a,#ffb03b);display:none;align-items:center;justify-content:center;padding:24px}
  .screen.show{display:flex}
  .card{background:#fff;border-radius:24px;padding:24px 20px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .card h1{margin:0 0 6px;font-size:24px} .card p{color:var(--sub);font-size:14px;line-height:1.7;margin:6px 0 0}
  .tabs2{display:flex;gap:6px;margin:16px 0 4px}
  .tabs2 button{flex:1;padding:9px;border-radius:999px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-weight:800}
  .tabs2 button.on{background:var(--accent);color:#fff}

  .toast{position:fixed;left:50%;bottom:calc(var(--sb) + 110px);transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;
    border-radius:12px;font-size:14px;z-index:2000;display:none;max-width:90%;text-align:center}
  .maplibregl-ctrl-attrib{font-size:9px}
  .maplibregl-ctrl-bottom-right{bottom:calc(var(--sb) + 0px)}
</style>
</head>
<body>
<div id="map"></div>

<div class="top" id="topUI" style="display:none">
  <button class="pill" id="pill">📍 おもいでマップ</button>
  <div class="chips" id="chips"></div>
</div>
<div class="side" id="sideUI" style="display:none">
  <button class="sbtn" id="bMembers" title="メンバー・招待">👥</button>
  <button class="sbtn" id="bSettings" title="設定">⚙️</button>
</div>
<div class="bottom" id="bottomUI" style="display:none">
  <button class="bbtn" id="bList" title="一覧">🔍</button>
  <button class="bbtn add" id="bAdd" title="記録する">＋</button>
  <button class="bbtn" id="bLocate" title="現在地">◎</button>
</div>

<div id="pick">
  <div class="msg">地図を動かして、📍をお店の場所に合わせてね</div>
  <div class="cross">📍</div>
  <div class="acts">
    <button class="btn s" id="pCancel">やめる</button>
    <button class="btn k" id="pHere" style="flex:.6">◎ 現在地</button>
    <button class="btn p" id="pOk">ここにする</button>
  </div>
</div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="screen" id="screen"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
/* =========================================================
   ★ ここに Firebase の設定を貼り付けてください ★
   (Firebaseコンソール → プロジェクトの設定 → マイアプリ → SDKの設定と構成)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD6BurYw0vgcm3vC-z6QJeKeXTnFlBvT-g",
  authDomain: "omoide-map-44499.firebaseapp.com",
  projectId: "omoide-map-44499",
  storageBucket: "omoide-map-44499.firebasestorage.app",
  messagingSenderId: "424450812814",
  appId: "1:424450812814:web:5e41d327cce966184f52df"
};
/* ========================================================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ---------- 定数・小道具 ----------
const GENRES = [
  {k:"cafe",label:"カフェ",emoji:"☕",color:"#b07a45"},
  {k:"ramen",label:"ラーメン",emoji:"🍜",color:"#e8553a"},
  {k:"meal",label:"ごはん",emoji:"🍚",color:"#2bb673"},
  {k:"sweets",label:"スイーツ",emoji:"🍰",color:"#ff7eb6"},
  {k:"izakaya",label:"居酒屋",emoji:"🍺",color:"#f2a516"},
  {k:"play",label:"あそび",emoji:"🎳",color:"#5b7cfa"},
  {k:"other",label:"その他",emoji:"📌",color:"#8a7d72"},
];
const G = Object.fromEntries(GENRES.map(g=>[g.k,g]));
const DEFAULT_CENTER = [37.87, 138.95]; // 新潟市西区あたり(初期表示用の目安)
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const starStr = n => "★".repeat(n||0) + "☆".repeat(5-(n||0));
const todayStr = () => { const d=new Date(), z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const LS = { get:k=>{try{return localStorage.getItem(k)}catch(_){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}} , del:k=>{try{localStorage.removeItem(k)}catch(_){}} };
// ---------- アイコン ----------
const EMOJIS = ["😀","😎","🥳","🐻","🐱","🐶","🦊","🐼","🐸","🐧","🍜","☕","🍰","⚽","🎮","🌸","🔥","👾"];
const ICON_COLORS = ["#ff6b4a","#ffb03b","#2bb673","#2f7bff","#8a5cf6","#ff7eb6","#1f1a17"];
function myIconLS(){ try{ return JSON.parse(LS.get("omoide.icon")||"null"); }catch(_){ return null; } }
// m = メンバー情報 {photo, icon}。size = px
function avatarHTML(m, size){
  const z = size||36, ic = m && m.icon;
  const box = `width:${z}px;height:${z}px`;
  if(ic && ic.type==="photo" && typeof ic.data==="string" && ic.data.startsWith("data:image/"))
    return `<span class="avatar" style="${box}"><img src="${esc(ic.data)}" alt=""></span>`;
  if(ic && ic.type==="emoji" && ic.emoji)
    return `<span class="avatar" style="${box};background:${/^#[0-9a-f]{6}$/i.test(ic.color||"")?ic.color:"#ffb03b"};font-size:${Math.round(z*0.55)}px">${esc(ic.emoji)}</span>`;
  if(m && m.photo)
    return `<span class="avatar" style="${box}"><img src="${esc(m.photo)}" alt="" referrerpolicy="no-referrer"></span>`;
  return `<span class="avatar" style="${box};font-size:${Math.round(z*0.55)}px">🙂</span>`;
}
const myself = () => ({ photo: me && me.photoURL, icon: myIconLS() || (me && members[me.uid] && members[me.uid].icon) || null });
let toastT;
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display="none",3200); }
function errMsg(e){
  const c = e && e.code || "";
  if (c.includes("permission-denied")) return "権限がありません(グループのメンバーか確認してね)";
  if (c.includes("unavailable")) return "通信できません。電波を確認してね";
  if (c.includes("popup-closed")) return "ログインがキャンセルされました";
  return "うまくいきませんでした(" + (c || "不明なエラー") + ")";
}

// ---------- アプリ内ブラウザ(LINE等)対策 ----------
const UA = navigator.userAgent;
const inApp = /Line\/|FBAN|FBAV|Instagram|Twitter|TikTok/i.test(UA);

// ---------- 画面 ----------
function showScreen(html){ $("#card").innerHTML = html; $("#screen").classList.add("show"); }
function hideScreen(){ $("#screen").classList.remove("show"); }
function openSheet(html){ $("#sheet").innerHTML = html; $("#ov").classList.add("show"); $("#sheet").scrollTop = 0; }
function closeSheet(){ $("#ov").classList.remove("show"); $("#sheet").innerHTML = ""; }
$("#ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeSheet(); });
function setMainUI(on){ ["#topUI","#sideUI","#bottomUI"].forEach(s=>$(s).style.display = on ? "" : "none"); }

// ---------- 地図 ----------
const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",
  center: [DEFAULT_CENTER[1], DEFAULT_CENTER[0]], zoom: 14,
  attributionControl: { compact: true },
  dragRotate: false, pitchWithRotate: false
});
map.touchZoomRotate.disableRotation();
// 地図の文字を日本語(現地名)で表示
map.on("load", ()=>{
  for(const ly of map.getStyle().layers){
    if(ly.type!=="symbol" || !ly.layout || !ly.layout["text-field"]) continue;
    if(!JSON.stringify(ly.layout["text-field"]).includes("name")) continue;
    try{ map.setLayoutProperty(ly.id, "text-field", ["coalesce", ["get","name:ja"], ["get","name"]]); }catch(_){}
  }
});
// Leafletと同じ感覚で使えるようにする小道具([緯度,経度]で受け取る)
function setView(ll, z){ map.jumpTo({ center:[ll[1], ll[0]], zoom: z }); }
function fitTo(pts){
  if(pts.length===1){ setView([pts[0].lat, pts[0].lng], 16); return; }
  const b = new maplibregl.LngLatBounds();
  pts.forEach(s=>b.extend([s.lng, s.lat]));
  map.fitBounds(b, { padding: 70, maxZoom: 16, duration: 0 });
}
function distM(a, b){ // 2点間の距離(m)
  const R=6371000, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
let markerObjs = [];
function updateFar(){ $("#map").classList.toggle("far", map.getZoom() < 15); }
map.on("zoom", updateFar); updateFar();

let meMarker = null, myPos = null, watchId = null;
function startLocate(pan){
  if(!navigator.geolocation){ toast("この端末では現在地が使えません"); return; }
  if(watchId===null){
    watchId = navigator.geolocation.watchPosition(p=>{
      myPos = [p.coords.latitude, p.coords.longitude];
      if(!meMarker) drawMe();
      else moveMe();
      if(pendingPan){ setView(myPos, Math.max(map.getZoom(),16)); pendingPan=false; }
    }, err=>{ toast(err.code===1 ? "位置情報の利用が許可されていません(ブラウザの設定を確認してね)" : "現在地を取得できませんでした"); pendingPan=false; },
    { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });
  }
  if(pan){ if(myPos){ setView(myPos, Math.max(map.getZoom(),16)); } else { pendingPan=true; } }
}
let pendingPan = false;
let meBase = null, heading = null;
function drawMe(){ // 現在地を自分のアイコンで表示(位置はこの端末の中だけで使い、送信しない)
  if(!myPos) return;
  if(meMarker){ meMarker.remove(); meMarker=null; }
  if(meBase){ meBase.remove(); meBase=null; }
  const ll = [myPos[1], myPos[0]];
  const base=document.createElement("div"); base.className="mebase";
  base.innerHTML = `<div class="mecone"></div><div class="medot"></div>`;
  meBase = new maplibregl.Marker({ element: base, rotationAlignment:"map", pitchAlignment:"map" }).setLngLat(ll).addTo(map);
  const el=document.createElement("div"); // 位置はMapLibreが外側の箱で管理するので、アニメは内側だけに付ける
  el.innerHTML = `<div class="mepin-in"><div class="mepic">${avatarHTML(myself(), 64)}</div><div class="metail"></div></div>`;
  meMarker = new maplibregl.Marker({ element: el, anchor:"bottom", offset:[0,-6] }).setLngLat(ll).addTo(map);
  applyHeading();
}
function moveMe(){ const ll=[myPos[1], myPos[0]]; if(meMarker) meMarker.setLngLat(ll); if(meBase) meBase.setLngLat(ll); }
function applyHeading(){
  if(!meBase) return;
  const cone = meBase.getElement().querySelector(".mecone");
  if(heading==null){ cone.style.display="none"; return; }
  cone.style.display="block"; meBase.setRotation(heading);
}
// スマホの向き(コンパス)。iPhoneは許可が必要なので、◎を押したときに聞く
let orientOn = false;
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading==="number") h = e.webkitCompassHeading;
  else if(e.absolute && typeof e.alpha==="number") h = 360 - e.alpha;
  if(h==null) return;
  heading = Math.round(h); applyHeading();
}
async function startOrientation(){
  if(orientOn) return;
  try{
    if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
      const r = await DeviceOrientationEvent.requestPermission(); if(r!=="granted") return;
    }
    window.addEventListener("deviceorientationabsolute", onOrient);
    window.addEventListener("deviceorientation", onOrient);
    orientOn = true;
  }catch(_){}
}

async function hashCode(code){
  const norm = "omoide:" + code.normalize("NFKC").trim().toLowerCase();
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,40);
}

    };

async function enterGroup(id){
  const snap = await getDoc(doc(db,"groups",id));

  const ic = myIconLS(); if(ic) mine.icon = ic;   // 端末に保存したアイコンをこのグループにも反映
  await setDoc(doc(db,"groups",id,"members",me.uid), mine, { merge:true });
  gid = id; gname = snap.data().name || "おもいでマップ"; gcode = LS.get("omoide.code."+id) || "";

  hideScreen(); setMainUI(true); startListening();
  try{ const st = await navigator.permissions.query({ name:"geolocation" }); if(st.state==="granted") startLocate(false); }catch(_){}

// ---------- 写真処理 ----------
function readExifGps(buf){
  try{
    const v=new DataView(buf); if(v.byteLength<4||v.getUint16(0)!==0xFFD8) return null;
    let o=2;
    while(o+4<v.byteLength){
      const m=v.getUint16(o); if((m&0xFF00)!==0xFF00||m===0xFFDA) return null;
      const len=v.getUint16(o+2);
      if(m===0xFFE1 && o+10<v.byteLength && v.getUint32(o+4)===0x45786966){
        const t=o+10, le=v.getUint16(t)===0x4949, u16=p=>v.getUint16(p,le), u32=p=>v.getUint32(p,le);
        const ifd0=t+u32(t+4); let gps=0;
        for(let i=0;i<u16(ifd0);i++){ const e=ifd0+2+i*12; if(u16(e)===0x8825) gps=t+u32(e+8); }
        if(!gps) return null;
        const rat3=off=>{let r=[];for(let k=0;k<3;k++){const p=off+k*8,d=u32(p+4);r.push(d?u32(p)/d:0);}return r[0]+r[1]/60+r[2]/3600;};
        let latRef="N",lngRef="E",lat=null,lng=null;
        for(let i=0;i<u16(gps);i++){ const e=gps+2+i*12, tag=u16(e);
          if(tag===1) latRef=String.fromCharCode(v.getUint8(e+8)); else if(tag===3) lngRef=String.fromCharCode(v.getUint8(e+8));
          else if(tag===2) lat=rat3(t+u32(e+8)); else if(tag===4) lng=rat3(t+u32(e+8)); }
        if(lat==null||lng==null||!isFinite(lat)||!isFinite(lng)||(lat===0&&lng===0)) return null;
        if(latRef==="S") lat=-lat; if(lngRef==="W") lng=-lng;
        return {lat,lng};
      }
      o+=2+len;
    }
  }catch(_){}
  return null;
}
async function loadImage(file){
  const url=URL.createObjectURL(file);
  try{ return await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; }); }
  finally{ setTimeout(()=>URL.revokeObjectURL(url), 1000); }
}
function toDataURL(img, max, square, q){
  let sw=img.naturalWidth, sh=img.naturalHeight, sx=0, sy=0;
  if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
  const k=Math.min(1, max/Math.max(sw,sh));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(sw*k)); c.height=Math.max(1,Math.round(sh*k));
  c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
async function makePhotos(file){
  const img = await loadImage(file);
  let full = toDataURL(img, 1080, false, 0.72);
  if(full.length > 850000) full = toDataURL(img, 800, false, 0.6);   // Firestoreの1ドキュメント上限(約1MB)対策
  const thumb = toDataURL(img, 140, true, 0.7);
  return { full, thumb };
}

      }
    }catch(e){ toast(errMsg(e)); btn.disabled=false; btn.textContent=edit?"更新する":"保存する"; }
  };
}

// ---------- メンバー・招待 ----------
$("#bMembers").onclick = ()=>{
  const list = Object.entries(members).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));
  openSheet(`<h2>👥 ${esc(gname)}</h2>
    ${list.map(([id,m])=>`<div class="member">${avatarHTML(m,36)}<div>${esc(m.name)}${id===me.uid?"(あなた)":""}<div class="hint" style="margin:0">${spots.filter(s=>s.createdBy===id).length}件の記録</div></div></div>`).join("")}
    <label class="f">友達を招待</label>
    ${gcode ? `<div class="hint">合言葉：<b>${esc(gcode)}</b></div><div class="row"><button class="btn p" id="inv">招待メッセージを送る</button></div>`
            : `<div class="hint">この端末には合言葉が保存されていません。合言葉を知っている人に聞いてね。</div>`}
    <div class="row"><button class="btn s" id="mClose">閉じる</button></div>`);
  $("#mClose").onclick=closeSheet;
  if(gcode) $("#inv").onclick=async()=>{
    const text = `おもいでマップ「${gname}」に参加してね！\n${location.origin+location.pathname}\n合言葉：${gcode}\n(LINEで開いたら「ブラウザで開く」を選んでね)`;
    try{ if(navigator.share){ await navigator.share({ text }); return; } }catch(_){ return; }
    try{ await navigator.clipboard.writeText(text); toast("招待メッセージをコピーしました"); }catch(_){ toast("コピーできませんでした"); }
  };
};

// ---------- 設定 ----------
$("#bSettings").onclick = ()=>{
  openSheet(`<h2>⚙️ 設定</h2>
    <label class="f">アイコン(グループのみんなに表示されます)</label>
    <div style="display:flex;align-items:center;gap:14px">
      <span id="icPrev">${avatarHTML(myself(),72)}</span>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <label class="btn p" style="text-align:center">📷 写真を選ぶ<input type="file" id="icFile" accept="image/*" hidden></label>
        <button class="btn s" id="icEmojiBtn">😀 絵文字にする</button>
        <button class="btn s" id="icGoogle">Googleの写真に戻す</button>
      </div>
    </div>
    <div id="icEmojiPanel" style="display:none">
      <div class="icgrid" id="icEmojis">${EMOJIS.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join("")}</div>
      <div class="icgrid" id="icColors">${ICON_COLORS.map(c=>`<button type="button" data-c="${c}" style="background:${c}" aria-label="色 ${c}"></button>`).join("")}</div>
      <div class="row"><button class="btn p" id="icEmojiOk">この絵文字にする</button></div>
    </div>
    <div class="meta" style="margin-top:16px">ログイン中：${esc(me.displayName||"")}<br>グループ：${esc(gname)}</div>
    <div class="row"><button class="btn s" id="sSwitch">グループを切り替える</button></div>
    <div class="row"><button class="btn s" id="sOut">ログアウト</button></div>
    <p class="hint" style="margin-top:16px">地図：© OpenStreetMap contributors © OpenFreeMap</p>
    <div class="row"><button class="btn s" id="sClose">閉じる</button></div>`);
  $("#sClose").onclick=closeSheet;
  $("#sSwitch").onclick=()=>{ closeSheet(); LS.del("omoide.gid"); gid=null; showGroupScreen(); };
  $("#sOut").onclick=()=>{ closeSheet(); LS.del("omoide.gid"); LS.del("omoide.icon"); signOut(auth); };

  const saveIcon = async (ic)=>{
    try{
      await setDoc(doc(db,"groups",gid,"members",me.uid), { icon: ic }, { merge:true });
      LS.set("omoide.icon", JSON.stringify(ic));
      $("#icPrev").innerHTML = avatarHTML(myself(),72);
      drawMe(); toast("アイコンを変更しました");
    }catch(e){ toast(errMsg(e)); }
  };
  $("#icFile").addEventListener("change", async e=>{
    const file = e.target.files && e.target.files[0]; if(!file) return;
    try{
      const img = await loadImage(file);
      let data = toDataURL(img, 160, true, 0.8);
      if(data.length > 55000) data = toDataURL(img, 120, true, 0.7);
      await saveIcon({ type:"photo", data });
    }catch(_){ toast("この写真は読み込めませんでした(JPEGで試してね)"); }
  });
  $("#icGoogle").onclick = ()=>saveIcon({ type:"google" });
  const cur = myIconLS() || {};
  let pickE = cur.emoji || EMOJIS[0], pickC = cur.color || ICON_COLORS[1];
  const mark = ()=>{
    [...$("#icEmojis").children].forEach(b=>b.classList.toggle("on", b.dataset.e===pickE));
    [...$("#icColors").children].forEach(b=>b.classList.toggle("on", b.dataset.c===pickC));
  };
  $("#icEmojiBtn").onclick = ()=>{ $("#icEmojiPanel").style.display="block"; mark(); };
  $("#icEmojis").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; pickE=b.dataset.e; mark(); };
  $("#icColors").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; pickC=b.dataset.c; mark(); };
  $("#icEmojiOk").onclick = ()=>saveIcon({ type:"emoji", emoji:pickE, color:pickC });
};
</script>
</body>
</html>
