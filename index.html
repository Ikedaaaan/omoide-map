<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AshiArt</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AshiArt">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{ --accent:#ff6b4a; --accent2:#ffb03b; --ink:#1f1a17; --sub:#7a6e66; --line:#eee3d8; --bg:#fff8f0; --ok:#2bb673;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif}
  #map{position:fixed;inset:0;background:#f2efe9}
  button{font-family:inherit}

  /* 上部 */
  .top{position:fixed;left:0;right:0;top:calc(var(--st) + 10px);z-index:500;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .pill{pointer-events:auto;background:rgba(255,255,255,.95);border-radius:999px;padding:9px 18px;font-weight:800;font-size:15px;
    box-shadow:0 3px 14px rgba(0,0,0,.14);border:none;color:var(--ink);max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill small{font-weight:600;color:var(--sub);margin-left:6px}
  .chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;max-width:100vw;padding:0 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 11px;border-radius:999px;border:none;background:rgba(255,255,255,.95);font-size:13px;font-weight:700;
    box-shadow:0 2px 8px rgba(0,0,0,.1);color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff}

  /* 右側ボタン */
  .side{position:fixed;right:12px;top:calc(var(--st) + 110px);z-index:500;display:flex;flex-direction:column;gap:10px}
  .sbtn{width:46px;height:46px;border-radius:14px;border:none;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.16);font-size:21px}

  /* 下部ボタン */
  .bottom{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 18px);z-index:500;display:flex;justify-content:center;gap:16px;align-items:center}
  .bbtn{width:64px;height:64px;border-radius:18px;border:none;background:#111;color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .bbtn.add{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,#ff6b4a,#ffb03b);font-size:36px;font-weight:800}

  /* ピン */
  .mk{position:relative;width:52px;height:60px}
  .mk-in{position:absolute;left:3px;top:0;width:46px;height:46px;border-radius:50%;background:var(--c);border:3px solid #fff;
    box-shadow:0 3px 10px rgba(0,0,0,.3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
  .mk-in img{width:100%;height:100%;object-fit:cover}
  .mk-tail{position:absolute;left:21px;top:42px;width:10px;height:10px;background:#fff;transform:rotate(45deg);box-shadow:2px 2px 4px rgba(0,0,0,.2)}
  .mk-badge{position:absolute;right:-2px;top:-4px;width:22px;height:22px;border-radius:50%;background:#fff;font-size:13px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .mk-label{position:absolute;top:56px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;color:var(--ink);
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;max-width:140px;overflow:hidden;text-overflow:ellipsis}
  .far .mk-label{display:none}
  /* 現在地(whoo風：角丸アイコンの吹き出し＋向きの扇形) */
  .mepin-in{position:relative;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));transform-origin:50% 100%;animation:mepop .35s ease-out}
  .mepic{width:72px;height:72px;border-radius:24px;border:4px solid #2f7bff;background:#fff;overflow:hidden;box-sizing:border-box}
  .mepic .avatar{width:100%!important;height:100%!important;border-radius:0!important}
  .metail{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:13px solid #2f7bff;margin-top:-2px}
  /* 友達の現在地(白い縁) */
  /* 👤 人で探す */
  .pxpeople{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .pxp{border:2px solid transparent;background:#f6f1ea;border-radius:14px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;color:var(--ink);min-width:0}
  .pxp img{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#ddd}
  .pxp b{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pxp span{font-size:10px;opacity:.6}
  .pxp.on{border-color:var(--accent);background:#fff1ec}
  .pxp.more{justify-content:center}
  .pxbar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:4px}
  .pxbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .pxsaved{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pxchip{border:none;background:#fff1ec;color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;font-family:inherit}
  .pxbtn{margin-left:auto;align-self:center;border:none;background:#fff1ec;color:#e0552f;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;font-family:inherit}
  /* 🌦 天気の演出 */
  #wx{position:fixed;inset:0;width:100%;height:100%;z-index:400;pointer-events:none}
  #wxBadge{position:fixed;right:12px;top:calc(var(--st) + 64px);z-index:520;display:none;align-items:center;gap:2px;background:rgba(255,255,255,.92);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.15);border:none;font-family:inherit;color:var(--ink)}
  /* 💨 移動中 */
  .puff{position:absolute;left:-34px;top:14px;z-index:3;font-size:24px;pointer-events:none;animation:puff .8s ease-in-out infinite;white-space:nowrap;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 1px 3px rgba(0,0,0,.35))}
  .puff.r{left:auto;right:-34px;transform:scaleX(-1)}
  .puff.r{animation-name:puffr}
  @keyframes puff{0%{opacity:1;transform:translateX(0)}100%{opacity:.55;transform:translateX(-8px)}}
  @keyframes puffr{0%{opacity:1;transform:scaleX(-1) translateX(0)}100%{opacity:.55;transform:scaleX(-1) translateX(-8px)}}
  .frpin-in{position:relative;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));cursor:pointer}
  .frpic{width:62px;height:62px;border-radius:21px;border:4px solid #fff;background:#fff;overflow:hidden;box-sizing:border-box}
  .frpic .avatar{width:100%!important;height:100%!important;border-radius:0!important}
  .frtail{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #fff;margin-top:-2px}
  /* ひとこと(インスタのノート風の吹き出し)と名前ラベル */
  .pnote{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);border-radius:16px;padding:6px 11px;
    font-size:12px;font-weight:700;line-height:1.35;width:max-content;max-width:150px;text-align:center;word-break:break-all;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .pnote:before{content:"";position:absolute;left:22px;bottom:-7px;width:11px;height:11px;border-radius:50%;background:#fff}
  .pnote:after{content:"";position:absolute;left:16px;bottom:-14px;width:6px;height:6px;border-radius:50%;background:#fff}
  .plabel{position:absolute;top:calc(100% + 2px);left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.2;
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
  .plabel b{display:block;font-size:12px;font-weight:900;color:var(--ink)}
  .plabel span{font-size:10px;font-weight:700;color:var(--sub)}
  .prof{text-align:center;padding-top:4px}
  .prof-av .avatar{border-radius:30px!important;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .prof-name{font-size:22px;font-weight:900;margin-top:10px}
  .prof-note{display:inline-block;margin-top:8px;background:#f6f1ec;border-radius:16px;padding:8px 14px;font-size:14px;color:var(--ink);max-width:90%}
  .prof-note small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
  .prof-note.empty{color:var(--sub)}
  .prof-row{margin-top:8px;font-size:13px;color:var(--sub)}
  .member{cursor:pointer}
  /* 足あとアート */
  #artv{position:fixed;inset:0;z-index:880;background:#efe7db;display:none;flex-direction:column}
  #artv.show{display:flex}
  .av-top{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 10px) 12px 8px}
  .av-top b{flex:1;text-align:center;font-size:17px}
  .av-top button,.av-bot button{border:none;border-radius:12px;background:#fff;color:var(--ink);font-weight:800;padding:9px 12px;font-family:inherit;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .av-top button:disabled{opacity:.35}
  .av-body{flex:1;overflow-y:auto;padding:4px 14px 10px;text-align:center}
  #avCanvas{width:100%;max-width:480px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);background:#fbf6ee}
  #avMsg{margin:60px 10px;color:#6b5d52;line-height:1.7;display:none}
  #avLegend{font-size:13px;color:#6b5d52;margin:10px 0}
  .av-bot{display:flex;gap:8px;justify-content:center;padding:6px 12px calc(var(--sb) + 14px)}
  /* 足あとタイム */
  #realBar{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 112px);z-index:560;background:#111;color:#fff;border-radius:18px;padding:10px 10px 10px 16px;
    display:none;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  #realBar.show{display:flex}
  #realBar b{flex:1;font-size:14px}
  #realBar button{border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;padding:10px 14px;font-family:inherit}
  #bReal{position:relative}
  .rdot{position:absolute;right:6px;top:6px;width:10px;height:10px;border-radius:50%;background:#ff3b30;border:2px solid #fff;display:none}
  .rpin{position:relative;width:58px;height:58px;cursor:pointer}
  .rpic{width:58px;height:58px;border-radius:16px;border:3px solid #ffd60a;background:#222;overflow:hidden;box-sizing:border-box;box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .rpic img{width:100%;height:100%;object-fit:cover;display:block}
  .rpic.blur img{filter:blur(8px)}
  .rbadge{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:#ffd60a;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .rl-card{margin-bottom:18px}
  .rl-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;flex-wrap:wrap}
  .rl-img{position:relative;border-radius:18px;overflow:hidden;background:#111;aspect-ratio:3/4;width:100%}
  .rl-img .bk{width:100%;height:100%;object-fit:cover;display:block}
  .rl-img .fr{position:absolute;left:10px;top:10px;width:30%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:2px solid #111}
  .rl-img.blur img{filter:blur(22px)}
  .rl-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-weight:700}
  .rl-lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;padding:20px;background:rgba(0,0,0,.25)}
  .late{color:#d9443a;font-weight:800;font-size:12px}
  .ontime{color:#1f9d60;font-weight:800;font-size:12px}
  /* アルバム */
  .al-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .al-th{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;cursor:pointer;background:#f3ebe2}
  .al-add{aspect-ratio:1;border:2px dashed #e0cfbf;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;color:#c08a5c;cursor:pointer;font-weight:800}
  .al-add span{font-size:12px}
  .al-h{display:flex;align-items:baseline;gap:6px;margin-top:16px;font-weight:800;font-size:16px}
  #viewer{position:fixed;inset:0;z-index:1500;background:#000;display:none;flex-direction:column}
  #viewer.show{display:flex}
  #viewer .vtop{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 10px) 12px 10px;color:#fff;font-size:14px}
  #viewer .vtop #vInfo{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #viewer .vbtn{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:8px 12px;font-size:15px;font-family:inherit;font-weight:700}
  #viewer .vmid{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  #vImg{max-width:100%;max-height:100%;object-fit:contain}
  #vPrev,#vNext{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.25);color:#fff;font-size:22px}
  #vPrev{left:8px} #vNext{right:8px}
  /* 置き写真(霧がかかった写真ピン) */
  .ltr{position:relative;width:54px;height:54px;border-radius:14px;background:#ddd;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer;overflow:visible}
  .ltr .ph{position:absolute;inset:0;border-radius:11px;overflow:hidden}
  .ltr .ph img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(3px) saturate(.8);transform:scale(1.15)}
  .ltr .fog{position:absolute;inset:0;border-radius:11px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75),rgba(255,255,255,.35));display:flex;align-items:center;justify-content:center;font-size:20px}
  .ltr.open{border-color:var(--accent)}
  .lfog{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#e9e4dc;margin-top:8px}
  .lfog img{width:100%;height:100%;object-fit:cover;filter:blur(14px);transform:scale(1.2)}
  .lfog span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;background:rgba(255,255,255,.35)}
  .ltr .bdg{position:absolute;right:-7px;bottom:-7px;width:22px;height:22px;border-radius:50%;background:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  /* 合流ショット */
  #meetBar{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 170px);z-index:560;background:#fff;border-radius:18px;padding:10px 10px 10px 14px;display:none;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.22);border:2px solid var(--accent)}
  #meetBar.show{display:flex}
  #meetBar b{flex:1;font-size:13px;line-height:1.4}
  #meetBar button{border:none;border-radius:12px;font-weight:800;padding:9px 12px;font-family:inherit}
  #meetShoot{background:var(--accent);color:#fff}
  #meetX{background:#f3ebe2;color:var(--ink)}
  .mpin{position:relative;width:56px;height:56px;cursor:pointer}
  .mpic{width:56px;height:56px;border-radius:50%;border:3px solid #2f7bff;overflow:hidden;background:#ddd;box-sizing:border-box;box-shadow:0 3px 10px rgba(0,0,0,.3)}
  .mpic img{width:100%;height:100%;object-fit:cover;display:block}
  .mbdg{position:absolute;right:-10px;top:-6px;background:#2f7bff;color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 6px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  /* 足あとモード */
  #bFoot.on{background:var(--accent);color:#fff}
  #footPanel{position:fixed;left:12px;top:calc(var(--st) + 110px);z-index:500;background:rgba(255,255,255,.95);border-radius:16px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-width:58%;display:none;font-size:13px}
  #footPanel.show{display:block}
  #footPanel b{font-size:14px}
  .fp-sub{color:#8a7d72;font-size:11px;margin:2px 0 4px}
  .fp-row{display:flex;align-items:center;gap:6px;margin-top:3px}
  .fp-dot{width:12px;height:12px;border-radius:50%;flex:none}
  .fp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fp-n{font-weight:800}
  .fp-head{display:flex;align-items:center;gap:6px}
  .fp-head b{flex:1;text-align:center;white-space:nowrap}
  .fp-head button{border:none;background:#f3ebe2;border-radius:8px;width:28px;height:26px;font-size:16px;font-weight:800;color:var(--ink)}
  .fp-head button:disabled{opacity:.3}
  /* おもいでタイムの振り返り(メモリーズ風) */
  #rhist{position:fixed;inset:0;z-index:880;background:#000;color:#fff;display:none;flex-direction:column}
  #rhist.show{display:flex}
  .rh-top{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 12px) 14px 8px}
  .rh-top b{flex:1;font-size:17px}
  .rh-x{border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:50%;width:38px;height:38px;font-size:17px}
  .rh-body{flex:1;overflow-y:auto;padding:0 4px calc(var(--sb) + 24px);-webkit-overflow-scrolling:touch}
  .rh-month{font-size:22px;font-weight:800;margin:20px 10px 10px}
  .rh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .rh-cell{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#1c1c1e;cursor:pointer}
  .rh-cell img{width:100%;height:100%;object-fit:cover;display:block}
  .rh-cell .d{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:500;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.75)}
  .rh-cell .lt{position:absolute;right:6px;bottom:6px;font-size:12px}
  .rh-note{text-align:center;color:#aaa;font-size:13px;margin:18px 0}
  .rtabs{display:flex;gap:6px;margin:4px 0 12px}
  .rtabs button{flex:1;border:none;border-radius:12px;padding:10px;font-weight:800;font-family:inherit;background:#f3ebe2;color:var(--ink)}
  .rtabs button.on{background:#111;color:#fff}
  .rday{font-weight:800;margin:14px 0 6px}
  .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .rcell{position:relative;cursor:pointer}
  .rcell img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:#222}
  .rcell.blur img{filter:blur(8px)}
  .rcell span{position:absolute;left:4px;bottom:4px;right:4px;font-size:11px;color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frpin-in.old{opacity:.6}
  .frpin-in.fuzzy .frpic{border-style:dashed}
  .mebase{position:relative;width:200px;height:200px;pointer-events:none}
  .mecone{position:absolute;inset:0;border-radius:50%;display:none;
    background:conic-gradient(from -35deg, rgba(47,123,255,.7) 0deg 70deg, transparent 70deg 360deg);
    -webkit-mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.75) 40%, transparent 71%);mask-image:radial-gradient(circle, #000 0%, rgba(0,0,0,.75) 40%, transparent 71%)}
  .medot{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#2f7bff;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  @keyframes mepop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  .avatar{border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex:none;background:#f3ebe2;box-sizing:border-box;vertical-align:middle;line-height:1}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .mk-who{position:absolute;left:-6px;top:-6px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex}
  .icgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .grow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:#faf6f2;margin-bottom:8px}

    const dup = GENRES.find(g=>g.label===label); if(dup){ toast("同じ名前のジャンルがあります"); return; }
    try{

const LS = { get:k=>{try{return localStorage.getItem(k)}catch(_){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}} , del:k=>{try{localStorage.removeItem(k)}catch(_){}} };
// ---------- アイコン ----------
const EMOJIS = ["😀","😎","🥳","🐻","🐱","🐶","🦊","🐼","🐸","🐧","🍜","☕","🍰","⚽","🎮","🌸","🔥","👾"];
const ICON_COLORS = ["#ff6b4a","#ffb03b","#2bb673","#2f7bff","#8a5cf6","#ff7eb6","#1f1a17"];

function avatarHTML(m, size){

  const c = e && e.code || "";

const UA = navigator.userAgent;
const inApp = /Line\/|FBAN|FBAV|Instagram|Twitter|TikTok/i.test(UA);

// ---------- 地図 ----------
const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",
  center: [DEFAULT_CENTER[1], DEFAULT_CENTER[0]], zoom: 14,
  attributionControl: { compact: true },
  dragRotate: false, pitchWithRotate: false
});
map.touchZoomRotate.disableRotation();
// 地図の文字を日本語(現地名)で表示
map.on("load", ()=>{
  for(const ly of map.getStyle().layers){
    if(ly.type!=="symbol" || !ly.layout || !ly.layout["text-field"]) continue;
    if(!JSON.stringify(ly.layout["text-field"]).includes("name")) continue;

// Leafletと同じ感覚で使えるようにする小道具([緯度,経度]で受け取る)
function setView(ll, z){ map.jumpTo({ center:[ll[1], ll[0]], zoom: z }); }

  if(pts.length===1){ setView([pts[0].lat, pts[0].lng], 16); return; }
  const b = new maplibregl.LngLatBounds();
  pts.forEach(s=>b.extend([s.lng, s.lat]));

}
function distM(a, b){ // 2点間の距離(m)
  const R=6371000, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
let markerObjs = [];
function updateFar(){ $("#map").classList.toggle("far", map.getZoom() < 15); }
map.on("zoom", updateFar); updateFar();

let meMarker = null, myPos = null, watchId = null;

      if(pendingPan){ setView(myPos, Math.max(map.getZoom(),16)); pendingPan=false; }
    }, err=>{ toast(err.code===1 ? "位置情報の利用が許可されていません(ブラウザの設定を確認してね)" : "現在地を取得できませんでした"); pendingPan=false; },

  }

}
let pendingPan = false;
let meBase = null, heading = null;
// ---------- 💨 移動中の表示(歩く=💨、走る・自転車など=💨💨) ----------
let mySamples = [], mySpeed = 0, myDir = 1, friendDir = {};
const motionLevel = spd => spd >= 2.5 ? 2 : spd >= 0.8 ? 1 : 0;   // m/秒(約3km/h以上で表示)
const puffHTML = (lv, dir) => lv ? `<div class="puff${dir<0?" r":""}">${lv>=2?"💨💨":"💨"}</div>` : "";
function updateMotion(p){
  const now = Date.now();
  if(p.coords.accuracy && p.coords.accuracy > 60) return;   // 精度が悪いときは使わない
  mySamples.push({ t: now, lat: p.coords.latitude, lng: p.coords.longitude });
  mySamples = mySamples.filter(x=>now - x.t <= 45000);
  let spd = (typeof p.coords.speed==="number" && p.coords.speed >= 0) ? p.coords.speed : null;
  const a = mySamples[0], b = mySamples[mySamples.length-1];
  if(a && b && b.t - a.t >= 8000){
    const d = distM({lat:a.lat,lng:a.lng}, {lat:b.lat,lng:b.lng});

  }
  mySpeed = spd || 0;
  applyMyMotion();
}
function applyMyMotion(){
  if(!meMarker) return;
  const w = meMarker.getElement().querySelector(".puffw"); if(!w) return;
  w.innerHTML = puffHTML(motionLevel(mySpeed), myDir);
}
setInterval(()=>{ const last = mySamples[mySamples.length-1]; if(mySpeed && (!last || Date.now()-last.t > 30000)){ mySpeed = 0; applyMyMotion(); } }, 10000);

function drawMe(){ // 現在地を自分のアイコンで表示(位置はこの端末の中だけで使い、送信しない)
  if(!myPos) return;

// スマホの向き(コンパス)。iPhoneは許可が必要なので、◎を押したときに聞く
let orientOn = false;
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading==="number") h = e.webkitCompassHeading;
  else if(e.absolute && typeof e.alpha==="number") h = 360 - e.alpha;
  if(h==null) return;
  heading = Math.round(h); applyHeading();
}
async function startOrientation(){ // 戻り値: "on" | "denied" | "unsupported" | "error:..."
  if(orientOn) return "on";
  if(typeof DeviceOrientationEvent==="undefined") return "unsupported";
  try{
    if(typeof DeviceOrientationEvent.requestPermission==="function"){
      const r = await DeviceOrientationEvent.requestPermission(); // iPhoneはここで確認画面が出る
      if(r!=="granted") return "denied";
    }
    window.addEventListener("deviceorientationabsolute", onOrient);
    window.addEventListener("deviceorientation", onOrient);
    orientOn = true; return "on";
  }catch(e){ return "error:" + (e && e.message || e); }
}
$("#bCompass").onclick = async ()=>{
  const r = await startOrientation();
  if(r==="denied"){ toast("向きの利用が拒否されています。Safariのタブを閉じて開き直すと、もう一度聞かれます"); return; }
  if(r==="unsupported"){ toast("この端末・ブラウザは向きの表示に対応していません"); return; }
  if(r.startsWith("error:")){ toast("確認画面を出せませんでした(" + r.slice(6) + ")"); return; }
  if(!myPos) startLocate(true);
  setTimeout(()=>{ toast(heading==null ? "向きの情報がまだ届いていません。スマホを少し動かしてみてね" : `向きを表示中(${heading}°)`); }, 1500);
};

async function hashCode(code){
  const norm = "omoide:" + code.normalize("NFKC").trim().toLowerCase();
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,40);
}

async function clearMyLocs(){ await Promise.all(allGroupIds().map(g=>deleteDoc(doc(db,"groups",g,"locs",me.uid)).catch(()=>{}))); }
async function sendLoc(force){
  if(!gid || !me || !myPos) return;
  const mode = shareMode(); if(mode==="off") return;
  const now = Date.now();
  const moved = lastSent.t ? distM({lat:myPos[0],lng:myPos[1]}, {lat:lastSent.lat,lng:lastSent.lng}) : 1e9;
  if(!force && now-lastSent.t < 60000 && moved < 30) return;   // 1分に1回まで(30m以上動いたら即送る)
  let lat = myPos[0], lng = myPos[1];
  if(mode==="fuzzy"){ lat = Math.round(lat/0.005)*0.005; lng = Math.round(lng/0.006)*0.006; } // 約500m単位にぼかす
  lastSent = { t:now, lat:myPos[0], lng:myPos[1] };
  const body = { lat, lng, fuzzy: mode==="fuzzy", updatedAt: now, spd: mode==="fuzzy" ? 0 : Math.round(mySpeed*10)/10 };
  await Promise.all(allGroupIds().map(g=>setDoc(doc(db,"groups",g,"locs",me.uid), body).catch(()=>{})));   // 参加している全部のグループに送る
}

function readExifGps(buf){
  try{
    const v=new DataView(buf); if(v.byteLength<4||v.getUint16(0)!==0xFFD8) return null;
    let o=2;
    while(o+4<v.byteLength){
      const m=v.getUint16(o); if((m&0xFF00)!==0xFF00||m===0xFFDA) return null;
      const len=v.getUint16(o+2);
      if(m===0xFFE1 && o+10<v.byteLength && v.getUint32(o+4)===0x45786966){
        const t=o+10, le=v.getUint16(t)===0x4949, u16=p=>v.getUint16(p,le), u32=p=>v.getUint32(p,le);
        const ifd0=t+u32(t+4); let gps=0;
        for(let i=0;i<u16(ifd0);i++){ const e=ifd0+2+i*12; if(u16(e)===0x8825) gps=t+u32(e+8); }
        if(!gps) return null;
        const rat3=off=>{let r=[];for(let k=0;k<3;k++){const p=off+k*8,d=u32(p+4);r.push(d?u32(p)/d:0);}return r[0]+r[1]/60+r[2]/3600;};
        let latRef="N",lngRef="E",lat=null,lng=null;
        for(let i=0;i<u16(gps);i++){ const e=gps+2+i*12, tag=u16(e);
          if(tag===1) latRef=String.fromCharCode(v.getUint8(e+8)); else if(tag===3) lngRef=String.fromCharCode(v.getUint8(e+8));
          else if(tag===2) lat=rat3(t+u32(e+8)); else if(tag===4) lng=rat3(t+u32(e+8)); }
        if(lat==null||lng==null||!isFinite(lat)||!isFinite(lng)||(lat===0&&lng===0)) return null;
        if(latRef==="S") lat=-lat; if(lngRef==="W") lng=-lng;
        return {lat,lng};
      }
      o+=2+len;
    }
  }catch(_){}
  return null;
}
async function loadImage(file){
  const url=URL.createObjectURL(file);
  try{ return await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; }); }
  finally{ setTimeout(()=>URL.revokeObjectURL(url), 1000); }
}
function toDataURL(img, max, square, q){
  let sw=img.naturalWidth, sh=img.naturalHeight, sx=0, sy=0;
  if(square){ const m=Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
  const k=Math.min(1, max/Math.max(sw,sh));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(sw*k)); c.height=Math.max(1,Math.round(sh*k));
  c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
async function makePhotos(file){
  const img = await loadImage(file);
  let full = toDataURL(img, 1080, false, 0.72);
  if(full.length > 850000) full = toDataURL(img, 800, false, 0.6);   // Firestoreの1ドキュメント上限(約1MB)対策
  const thumb = toDataURL(img, 140, true, 0.7);
  return { full, thumb };
}

// ---------- 写真から作る(撮影場所を読み取ってアルバムを作る) ----------
// 写真の撮影日時(EXIF DateTimeOriginal)。読めなければ null
function readExifDate(buf){
  try{
    const v=new DataView(buf); if(v.byteLength<4||v.getUint16(0)!==0xFFD8) return null;
    let o=2;
    while(o+4<v.byteLength){
      const m=v.getUint16(o); if((m&0xFF00)!==0xFF00||m===0xFFDA) return null;
      const len=v.getUint16(o+2);
      if(m===0xFFE1 && o+10<v.byteLength && v.getUint32(o+4)===0x45786966){
        const t=o+10, le=v.getUint16(t)===0x4949, u16=p=>v.getUint16(p,le), u32=p=>v.getUint32(p,le);
        const ifd0=t+u32(t+4); let ex=0;
        for(let i=0;i<u16(ifd0);i++){ const e=ifd0+2+i*12; if(u16(e)===0x8769) ex=t+u32(e+8); }
        if(!ex) return null;
        for(let i=0;i<u16(ex);i++){ const e=ex+2+i*12; if(u16(e)===0x9003){ const p=t+u32(e+8); let s=""; for(let k=0;k<19;k++) s+=String.fromCharCode(v.getUint8(p+k));
          const mm=/^(\d{4}):(\d{2}):(\d{2})/.exec(s); return mm ? `${mm[1]}-${mm[2]}-${mm[3]}` : null; } }
        return null;
      }
      o+=2+len;
    }
  }catch(_){}
  return null;
}

  await setDoc(doc(db,"groups",gid,"albimg",ref.id), { data: full });
}

function openPhotoImport(){

    <p class="hint">写真をまとめて選ぶと、撮影した場所ごとに分けて、その場所にアルバムを作ります。近い場所(約100m以内)の写真は1つにまとめます。</p>

  $("#impNo").onclick = closeSheet;

    const files = [...(e.target.files||[])].slice(0, 60); if(!files.length) return;
    $("#impMsg").textContent = "撮影場所を読み取り中…";
    const withPos = [], noPos = [];
    for(const f of files){
      let pos=null, date=null;
      try{ const buf = await f.slice(0, 256*1024).arrayBuffer(); pos = readExifGps(buf); date = readExifDate(buf); }catch(_){}
      (pos ? withPos : noPos).push({ f, pos, date });
    }
    // 近い写真(100m以内)をまとめる
    const groups = [];

      g.items.push(p);
      g.pos = { lat: g.items.reduce((a,x)=>a+x.pos.lat,0)/g.items.length, lng: g.items.reduce((a,x)=>a+x.pos.lng,0)/g.items.length };
    }
    if(noPos.length) groups.push({ pos:null, items:noPos });
    groups.forEach(g=>{ g.files = g.items.map(x=>x.f); g.date = g.items.map(x=>x.date).filter(Boolean).sort()[0] || ""; g.urls = g.files.slice(0,6).map(f=>{ try{ return URL.createObjectURL(f); }catch(_){ return ""; } }); });
    imp = { groups, i:0, made:0, total: files.length, found: withPos.length };

      $("#impMsg").innerHTML = `⚠️ ${files.length}枚とも撮影場所が読み取れませんでした。<br>写真を選ぶ画面の「オプション」→「位置情報」をオンにして、もう一度選んでみてね。<br><button type="button" class="btn s" id="impAnyway" style="margin-top:8px;width:100%">場所は地図で選んで続ける</button>`;
      $("#impAnyway").onclick = ()=>impStep();
      return;
    }
    impStep();
  });
}

// ---------- 👣 足あとモード(行った場所・歩いた道で地図を塗る) ----------
const FOOT_CELL = 0.0005;   // 約50mのマス
const FOOT_COLORS = ["#ff6b4a","#2f7bff","#2bb673","#a855f7","#ffb03b","#f43f5e","#14b8a6","#6366f1"];
let trails = {}, footOn = false, myTrailCells = new Set(), myTrailDay = null;
const trailOn = () => LS.get("omoide.trail") !== "off";
function memberColor(uid){
  const ic = members[uid] && members[uid].icon;
  if(ic && ic.color && /^#[0-9a-fA-F]{6}$/.test(ic.color)) return ic.color;
  let h = 0; for(const c of String(uid)) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return FOOT_COLORS[h % FOOT_COLORS.length];
}
const cellKey = (lat,lng) => (Math.round(lat/FOOT_CELL)*FOOT_CELL).toFixed(4) + "," + (Math.round(lng/FOOT_CELL)*FOOT_CELL).toFixed(4);
// アプリを開いている間、新しいマスに入ったら記録する(参加中の全グループ)
async function recordTrail(lat, lng, acc){
  if(!me || !gid || !trailOn() || (acc && acc > 80)) return;
  const d = jstDate(); if(d !== myTrailDay){ myTrailDay = d; myTrailCells = new Set(); }
  const k = cellKey(lat, lng); if(myTrailCells.has(k)) return; myTrailCells.add(k);
  for(const g of allGroupIds()){
    try{ await setDoc(doc(db,"groups",g,"trail",me.uid+"_"+d), { uid: me.uid, date: d, pts: arrayUnion(k), updatedAt: Date.now() }, { merge: true }); }catch(_){}
  }
}
// 月ごとに塗る(見た目は毎月リセット。過去の月は ‹ › で見返せる)
let footMonth = null;
const curMonth = () => jstDate().slice(0,7);
const spotMonth = s => (s.visited && /^\d{4}-\d{2}/.test(s.visited)) ? s.visited.slice(0,7) : jstDate(s.createdAt || Date.now()).slice(0,7);
function monthCells(m){
  const cells = {};   // uid -> Set(マス)
  const put = (u,k)=>{ (cells[u] = cells[u] || new Set()).add(k); };
  for(const t of Object.values(trails)) if((t.date||"").startsWith(m)) for(const k of (t.pts||[])) put(t.uid, String(k));
  spots.forEach(s=>{ if(spotMonth(s)===m && typeof s.lat==="number") put(s.createdBy, cellKey(s.lat,s.lng)); });
  Object.values(reals).forEach(r=>{ if((r.date||"").startsWith(m) && typeof r.lat==="number") put(r.uid, cellKey(r.lat,r.lng)); });
  Object.values(meets).forEach(M=>{ if(jstDate(M.at||0).startsWith(m) && typeof M.lat==="number") [M.uid, ...(M.with||[])].forEach(u=>put(u, cellKey(M.lat,M.lng))); });
  return cells;
}
function footFeatures(){
  const f = [], cells = monthCells(footMonth || curMonth());
  for(const [u,set] of Object.entries(cells)) for(const k of set){
    const [a,b] = k.split(",").map(Number); if(!isFinite(a) || !isFinite(b)) continue;
    f.push({ type:"Feature", properties:{ c: memberColor(u) }, geometry:{ type:"Point", coordinates:[b, a] } });
  }
  return { type:"FeatureCollection", features:f };
}
function shiftMonth(m, d){ let [y,mm] = m.split("-").map(Number); mm += d; while(mm<1){ mm+=12; y--; } while(mm>12){ mm-=12; y++; } return `${y}-${String(mm).padStart(2,"0")}`; }
function ensureFootLayers(){
  if(!mapReady) return false;
  if(!map.getSource("foot")){
    map.addSource("fog", { type:"geojson", data:{ type:"Feature", properties:{}, geometry:{ type:"Polygon", coordinates:[[[-180,-85],[180,-85],[180,85],[-180,85],[-180,-85]]] } } });
    map.addSource("foot", { type:"geojson", data: footFeatures() });
    map.addLayer({ id:"fog", type:"fill", source:"fog", layout:{ visibility:"none" }, paint:{ "fill-color":"#fff8ef", "fill-opacity":0.62 } });
    map.addLayer({ id:"foot", type:"circle", source:"foot", layout:{ visibility:"none" }, paint:{
      "circle-color":["get","c"], "circle-opacity":0.3, "circle-blur":0.55,
      "circle-radius":["interpolate",["exponential",2],["zoom"], 8,0.2, 20,850] } });   // 半径およそ50m
  }
  return true;
}
function updateFoot(){
  if(!footOn) return;
  const src = map.getSource("foot"); if(src) src.setData(footFeatures());
  updateFootPanel();
}
function updateFootPanel(){
  const el = $("#footPanel"); if(!el || !footOn) return;
  const m = footMonth || curMonth(), isCur = m===curMonth();
  const cells = monthCells(m), n = u => cells[u] ? cells[u].size : 0;
  const uids = [...new Set([...Object.keys(members), ...Object.keys(cells)])].filter(u=>members[u] || n(u)).sort((a,b)=>n(b)-n(a));
  let extra = "";
  if(isCur && +jstDate().slice(8,10) <= 7){   // 月初めの1週間は先月の1位を発表
    const pc = monthCells(shiftMonth(m,-1)); const top = Object.keys(pc).sort((a,b)=>pc[b].size-pc[a].size)[0];
    if(top && pc[top].size) extra = `<div class="fp-sub">🏆 先月の1位は${esc(who(top))}さん(${pc[top].size}マス)</div>`;
  }
  el.innerHTML = `<div class="fp-head"><button type="button" data-mv="-1">‹</button><b>👣 ${+m.slice(0,4)}年${+m.slice(5,7)}月</b><button type="button" data-mv="1" ${isCur?"disabled":""}>›</button></div>`
    + `<div class="fp-sub">${isCur ? `今月の自分：${n(me && me.uid)}マス` : "この月の足あと"}</div>` + extra
    + uids.map((u,i)=>`<div class="fp-row"><span class="fp-dot" style="background:${memberColor(u)}"></span><span class="fp-name">${n(u)&&i===0?"👑 ":""}${esc(who(u))}</span><span class="fp-n">${n(u)}</span></div>`).join("")
    + `<div class="fp-sub">${isCur ? (trailOn() ? "毎月1日にまっさらからスタート" : "歩いた道の記録はオフ(⚙️で変更)") : "過去の月は見返すだけ"}</div>`;
}
$("#footPanel").addEventListener("click", e=>{
  const b = e.target.closest("button[data-mv]"); if(!b || b.disabled) return;
  const m = shiftMonth(footMonth || curMonth(), +b.dataset.mv);
  footMonth = m > curMonth() ? curMonth() : m;
  updateFoot();
});
function setFoot(on){
  footOn = on;
  $("#bFoot").classList.toggle("on", on);
  $("#footPanel").classList.toggle("show", on);
  if(!ensureFootLayers()) return;   // 地図の準備ができたら load で続きをやる
  ["fog","foot"].forEach(id=>map.setLayoutProperty(id, "visibility", on ? "visible" : "none"));
  if(on){ footMonth = curMonth(); updateFoot(); if(map.getZoom() > 15) map.easeTo({ zoom: 14 }); }
}
$("#bFoot").onclick = ()=>setFoot(!footOn);

// ---------- 👥 合流ショット(友達と近くにいるときに一緒に1枚) ----------
const MEET_M = 100, MEET_FRESH = 10*60*1000;
let meets = {}, meetMarkers = [], meetNearby = [], meetShowing = [];
// 今日その人と一緒に合流ショットを撮ったか(同じ人とは1日1回まで)
function shotToday(u){
  const today = jstDate();
  return Object.values(meets).some(M=>{ if(jstDate(M.at||0)!==today) return false; const p = [M.uid, ...(M.with||[])]; return p.includes(me.uid) && p.includes(u); });
}
function meetSeen(){ try{ return JSON.parse(LS.get("omoide.meetseen")||"{}"); }catch(_){ return {}; } }
// 位置共有中の友達が100m以内・10分以内に更新していたら声をかける(同じ人とは1日1回まで。今日もう一緒に撮った人には出さない)
function checkMeet(){
  const bar = $("#meetBar"); if(!bar) return;
  if(!me || !gid || !myPos){ bar.classList.remove("show"); meetShowing = []; return; }
  const now = Date.now();
  meetNearby = Object.entries(locs).filter(([u,L])=>u!==me.uid && !L.fuzzy && typeof L.lat==="number" && now-(L.updatedAt||0) < MEET_FRESH
    && distM({lat:myPos[0],lng:myPos[1]}, {lat:L.lat,lng:L.lng}) <= MEET_M).map(([u])=>u);
  if(meetShowing.length){   // 表示中は、近くにいる間はそのまま
    meetShowing = meetShowing.filter(u=>meetNearby.includes(u));
    if(!meetShowing.length) bar.classList.remove("show");
    return;
  }
  const today = jstDate(), seen = meetSeen();
  const ok = u=>{ const r = seen[u]; return !shotToday(u) && (!r || typeof r!=="object" || r.d!==today); };
  const fresh = meetNearby.filter(ok);
  if(!fresh.length){ bar.classList.remove("show"); return; }
  fresh.forEach(u=>{ const r = seen[u]; seen[u] = (r && typeof r==="object" && r.d===today) ? { d:today, n:r.n+1, t:now } : { d:today, n:1, t:now }; });
  LS.set("omoide.meetseen", JSON.stringify(seen));
  meetShowing = fresh;
  $("#meetText").textContent = `👥 ${fresh.map(u=>who(u)).slice(0,3).join("さん、")}さん${fresh.length>3?"たち":""}が近くにいるよ！一緒に1枚撮ろう`;
  bar.classList.add("show");
}

// ---------- 🌦 天気の演出(今いる場所の天気で、画面全体にうっすら雨・雪・風などをかぶせる) ----------
// 天気は Open-Meteo(無料・登録不要)から10分おきに取得。設定:オフ/さりげなく/しっかり
const wxMode = () => LS.get("omoide.wx") || "soft";
let wxState = "idle", wxErr = "";
let wx = null, wxAt = 0, wxParts = [], wxFlash = 0, wxRaf = null, wxLastPos = null;
const WX_NAMES = { clear:"晴れ", night:"晴れ(夜)", cloudy:"くもり", fog:"霧", rain:"雨", heavyrain:"強い雨", snow:"雪", thunder:"雷雨" };
const WX_EMOJI = { clear:"☀️", night:"🌙", cloudy:"☁️", fog:"🌫️", rain:"🌧️", heavyrain:"🌧️", snow:"❄️", thunder:"⛈️" };
function wxKind(code, isDay){
  if([95,96,99].includes(code)) return "thunder";
  if([71,73,75,77,85,86].includes(code)) return "snow";
  if([63,65,67,81,82].includes(code)) return "heavyrain";
  if([51,53,55,56,57,61,66,80].includes(code)) return "rain";
  if([45,48].includes(code)) return "fog";
  if([2,3].includes(code)) return "cloudy";
  return isDay ? "clear" : "night";
}
async function fetchWx(force){
  const p = myPos ? { lat: myPos[0], lng: myPos[1] } : (map ? { lat: map.getCenter().lat, lng: map.getCenter().lng } : null);
  if(!p) return;
  const moved = wxLastPos ? distM(p, wxLastPos) : 1e9;
  if(!force && wx && Date.now() - wxAt < 10*60*1000 && moved < 3000) return;
  wxState = wx ? "ok" : "loading"; wxBadge();
  const la = p.lat.toFixed(3), lo = p.lng.toFixed(3);
  try{
    // ① Open-Meteo
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,weather_code,wind_speed_10m,is_day&wind_speed_unit=ms&timezone=auto`;
    const j = await (await fetch(u, { cache:"no-store" })).json(); const c = j && j.current; if(!c) throw new Error("no current");
    wx = { kind: wxKind(c.weather_code, c.is_day), temp: Math.round(c.temperature_2m), wind: c.wind_speed_10m, windy: c.wind_speed_10m >= 8, src:"Open-Meteo" };
  }catch(e1){
    try{
      // ② 予備: MET Norway(ノルウェー気象局・登録不要)
      const j = await (await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${la}&lon=${lo}`)).json();
      const ts = j.properties.timeseries[0], d = ts.data.instant.details;
      const sym = ((ts.data.next_1_hours||ts.data.next_6_hours||{}).summary||{}).symbol_code || "";
      const h = new Date().getHours(), isDay = h>=6 && h<17;
      const kind = /thunder/.test(sym) ? "thunder" : /snow|sleet/.test(sym) ? "snow" : /heavyrain/.test(sym) ? "heavyrain" : /rain/.test(sym) ? "rain" : /fog/.test(sym) ? "fog" : /cloudy|partlycloudy/.test(sym) ? "cloudy" : (isDay ? "clear" : "night");
      wx = { kind, temp: Math.round(d.air_temperature), wind: d.wind_speed, windy: d.wind_speed >= 8, src:"MET Norway" };
    }catch(e2){ wxState = "error"; wxErr = String(e1 && e1.message || e1); wxBadge(); return; }
  }
  wxState = "ok"; wxAt = Date.now(); wxLastPos = p;
  wxStart();
}
function wxBadge(){
  const b = $("#wxBadge"); if(!b) return;
  if(wxMode()==="off"){ b.style.display = "none"; return; }
  b.style.display = "flex";
  if(!wx){ b.textContent = wxState==="error" ? "⚠️ 天気" : "🌦 …"; return; }
  b.textContent = `${WX_EMOJI[wx.kind]}${wx.windy?"💨":""} ${wx.temp}℃`;
}
$("#wxBadge").onclick = ()=>{
  if(wx) toast(`${WX_NAMES[wx.kind]} ${wx.temp}℃ ・ 風 ${wx.wind.toFixed(1)}m/s(天気:${wx.src||"Open-Meteo"})`);
  else if(wxState==="error"){ toast("天気を取得できませんでした。もう一度試します(" + wxErr + ")"); fetchWx(true); }
  else toast("天気を取得中…");
};
// 粒(雨・雪・風・星・雲)を作り直す
function wxReset(){
  const cv = $("#wx"); if(!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const W = cv.width, H = cv.height, strong = wxMode()==="strong";
  wxParts = [];
  if(!wx) return;
  const k = wx.kind, area = (W*H) / (390*844*dpr*dpr);
  const n = (base)=>Math.round(base * area * (strong ? 1.3 : 0.8));
  const R = Math.random;
  if(k==="rain" || k==="heavyrain" || k==="thunder"){ const m = k==="rain" ? 70 : 150; for(let i=0;i<n(m);i++) wxParts.push({ t:"rain", x:R()*W, y:R()*H, l:(10+R()*14)*dpr, v:(9+R()*6)*dpr }); }
  if(k==="snow") for(let i=0;i<n(90);i++) wxParts.push({ t:"snow", x:R()*W, y:R()*H, r:(1.5+R()*3)*dpr, v:(0.6+R()*1.2)*dpr, p:R()*6.28 });
  if(k==="night") for(let i=0;i<n(60);i++) wxParts.push({ t:"star", x:R()*W, y:R()*H*0.7, r:(0.6+R()*1.2)*dpr, p:R()*6.28 });
  if(k==="cloudy" || k==="fog") for(let i=0;i<n(6)+1;i++) wxParts.push({ t:"cloud", x:R()*W, y:R()*H, r:(120+R()*160)*dpr, v:(0.15+R()*0.25)*dpr });
  if(wx.windy) for(let i=0;i<n(26);i++) wxParts.push({ t:"wind", x:R()*W, y:R()*H, l:(60+R()*120)*dpr, v:(10+R()*8)*dpr });
}
function wxFrame(){
  wxRaf = null;
  const cv = $("#wx"); if(!cv) return;
  const mode = wxMode();
  const x = cv.getContext("2d"), W = cv.width, H = cv.height;
  x.clearRect(0,0,W,H);
  if(mode==="off" || !wx || document.hidden){ cv.style.display = mode==="off" ? "none" : "block"; return; }
  cv.style.display = "block";
  const s = mode==="strong" ? 1.4 : 0.85, k = wx.kind, t = Date.now()/1000;
  const dx = wx.windy ? 3 : 1.2;   // 風が強いと雨や雪が斜めに
  // 画面全体の色味
  const tint = { clear:null, night:"rgba(20,30,70,", cloudy:"rgba(110,120,135,", fog:"rgba(235,238,242,", rain:"rgba(60,90,130,", heavyrain:"rgba(40,60,100,", snow:"rgba(220,230,245,", thunder:"rgba(35,40,70," }[k];
  const ta = { night:0.30, cloudy:0.18, fog:0.38, rain:0.22, heavyrain:0.30, snow:0.20, thunder:0.32 }[k];
  if(tint){ x.fillStyle = tint + (ta*s) + ")"; x.fillRect(0,0,W,H); }
  if(k==="clear"){ const g = x.createRadialGradient(W*0.85, H*0.05, 0, W*0.85, H*0.05, Math.max(W,H)*0.75); const a = Math.min(0.6, (0.3 + 0.06*Math.sin(t*0.8))*s); g.addColorStop(0, `rgba(255,214,120,${a})`); g.addColorStop(1, "rgba(255,214,120,0)"); x.fillStyle = g; x.fillRect(0,0,W,H); }
  for(const p of wxParts){
    if(p.t==="rain"){
      x.strokeStyle = `rgba(210,228,255,${Math.min(0.95,0.55*s+0.2)})`; x.lineWidth = 1.6*Math.min(2, window.devicePixelRatio||1); x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(p.x - p.l*dx*0.15, p.y + p.l); x.stroke();
      p.y += p.v; p.x -= p.v*dx*0.15; if(p.y > H){ p.y = -p.l; p.x = Math.random()*W*1.2; }
    }else if(p.t==="snow"){
      x.fillStyle = `rgba(255,255,255,${Math.min(1,0.7*s+0.25)})`; x.beginPath(); x.arc(p.x + Math.sin(t+p.p)*6, p.y, p.r, 0, 6.28); x.fill();
      p.y += p.v; p.x -= (dx-1)*0.8; if(p.y > H){ p.y = -5; p.x = Math.random()*W; } if(p.x < -10) p.x = W+10;
    }else if(p.t==="star"){
      x.fillStyle = `rgba(255,255,230,${(0.35+0.35*Math.sin(t*2+p.p))*s})`; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.28); x.fill();
    }else if(p.t==="cloud"){
      const g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r); const a = (k==="fog"?0.32:0.2)*s; g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, "rgba(255,255,255,0)");
      x.fillStyle = g; x.fillRect(p.x-p.r, p.y-p.r, p.r*2, p.r*2); p.x += p.v; if(p.x - p.r > W) p.x = -p.r;
    }else if(p.t==="wind"){
      x.strokeStyle = `rgba(255,255,255,${Math.min(0.9,0.5*s+0.1)})`; x.lineWidth = 2.2; x.beginPath(); x.moveTo(p.x, p.y); x.quadraticCurveTo(p.x - p.l/2, p.y - 6, p.x - p.l, p.y); x.stroke();
      p.x += p.v; if(p.x - p.l > W){ p.x = -10; p.y = Math.random()*H; }
    }
  }
  if(k==="thunder"){ if(wxFlash <= 0 && Math.random() < 0.004) wxFlash = 1; if(wxFlash > 0){ x.fillStyle = `rgba(255,255,255,${Math.min(0.8,wxFlash*0.5*s)})`; x.fillRect(0,0,W,H); wxFlash -= 0.06; } }
  wxRaf = requestAnimationFrame(wxFrame);
}
function wxStart(){ wxBadge(); wxReset(); if(!wxRaf) wxRaf = requestAnimationFrame(wxFrame); }
addEventListener("resize", ()=>wxReset());
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ fetchWx(); wxStart(); } });
setInterval(()=>fetchWx(), 60*1000);
setTimeout(()=>{ fetchWx(true).then(wxStart); }, 2500);

// ---------- 👤 人で探す(顔でアルバムの写真を絞り込む) ----------
// 顔の解析はこの端末の中だけ(face-api)。顔のデータと名前は端末(IndexedDB)に保存し、サーバーには送らない。
// サーバーに保存するのは「人のアルバム」(名前と写真IDのリスト)だけ。
const FACE_LIB = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.esm.js";
const FACE_MODELS = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
const FACE_TH = 0.5;   // 顔の似ている度合い(小さいほど厳しい)
let faceapi = null, faceLoading = null;
async function loadFaceApi(){
  if(faceapi) return faceapi;
  if(!faceLoading) faceLoading = (async()=>{
    const m = await import(FACE_LIB);
    const fa = (m.nets ? m : m.default);
    try{ if(fa.tf){ await fa.tf.setBackend("webgl"); await fa.tf.ready(); } }catch(_){}
    await Promise.all([
      fa.nets.ssdMobilenetv1.loadFromUri(FACE_MODELS),
      fa.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),
      fa.nets.faceRecognitionNet.loadFromUri(FACE_MODELS)
    ]);
    faceapi = fa; return fa;
  })().catch(e=>{ faceLoading = null; throw e; });
  return faceLoading;
}
// 端末内の保存場所(IndexedDB)
const fdb = (()=>{
  let p = null;
  const open = ()=> p || (p = new Promise((res,rej)=>{ const r = indexedDB.open("ashiart-faces", 1); r.onupgradeneeded = ()=>r.result.createObjectStore("kv"); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }));
  const run = async (mode, fn)=>{ const d = await open(); return new Promise((res,rej)=>{ const t = d.transaction("kv", mode); const r = fn(t.objectStore("kv")); t.oncomplete = ()=>res(r && r.result); t.onerror = ()=>rej(t.error); }); };
  return {
    get: k=>run("readonly", s=>s.get(k)),
    set: (k,v)=>run("readwrite", s=>s.put(v,k)),
    all: async prefix=>{ const d = await open(); return new Promise((res,rej)=>{ const out = {}; const t = d.transaction("kv","readonly");
      const rq = t.objectStore("kv").openCursor(IDBKeyRange.bound(prefix, prefix + "\uffff"));
      rq.onsuccess = ()=>{ const c = rq.result; if(c){ out[c.key] = c.value; c.continue(); } };
      t.oncomplete = ()=>res(out); t.onerror = ()=>rej(t.error); }); }
  };
})();
let fx = null;   // { gid, items, faces:{albumId:{faces:[{d,c}]}}, persons:[{id,name,faces:[key]}], sel:Set, cl, running, done, todo, err }
function fdist(a, b){ let s = 0; for(let i=0;i<a.length;i++){ const d = a[i]-b[i]; s += d*d; } return Math.sqrt(s); }
function faceCrop(img, b){
  const s = Math.max(b.width, b.height) * 1.6, cv = document.createElement("canvas"); cv.width = cv.height = 96;
  cv.getContext("2d").drawImage(img, b.x + b.width/2 - s/2, b.y + b.height/2 - s/2, s, s, 0, 0, 96, 96);
  return cv.toDataURL("image/jpeg", 0.7);
}
// 顔を「人」ごとにまとめる(名前を付けた人を優先、残りは似ている順に)
function faceClusters(){
  const all = [];
  for(const a of fx.items){ const f = fx.faces[a.id]; if(f && f.faces) f.faces.forEach((x,i)=>all.push({ key:`${a.id}#${i}`, aid:a.id, d:x.d, c:x.c })); }
  const byKey = Object.fromEntries(all.map(f=>[f.key, f]));
  const cent = fs=>{ const m = new Array(128).fill(0); for(const f of fs) for(let i=0;i<128;i++) m[i] += f.d[i]/fs.length; return m; };
  const cl = [], used = new Set();
  for(const p of fx.persons){
    const fs = p.faces.map(k=>byKey[k]).filter(Boolean); if(!fs.length) continue;
    fs.forEach(f=>used.add(f.key)); cl.push({ pid:p.id, name:p.name, faces:fs, m:cent(fs) });
  }
  for(const f of all){
    if(used.has(f.key)) continue;
    let best = null, bd = FACE_TH;
    for(const c of cl){ const d = fdist(f.d, c.m); if(d < bd){ bd = d; best = c; } }
    if(best){ best.faces.push(f); if(!best.pid) best.m = cent(best.faces); }
    else cl.push({ faces:[f], m:f.d.slice() });
  }
  cl.forEach(c=>{ c.aids = new Set(c.faces.map(f=>f.aid)); c.id = c.pid || c.faces[0].key; });
  cl.sort((a,b)=>(b.pid?1:0) - (a.pid?1:0) || b.aids.size - a.aids.size);
  return cl;
}
async function openPeople(){
  if(!fx || fx.gid !== gid) fx = { gid, items:[], faces:{}, persons:[], sel:new Set(), cl:[], running:false, done:0, todo:0, err:"" };
  openSheet(`<h2>👤 人で探す</h2>
    <p class="hint" style="margin-top:4px">顔の解析はこのスマホの中だけで行います。顔のデータや名前はサーバーに送りません。</p>
    <div id="pxProg"></div>
    <div id="pxSaved"></div>
    <div class="al-h">写っている人 <span class="hint" style="margin:0">タップで選ぶ(2人以上で「両方写っている写真」)</span></div>
    <div id="pxPeople" class="pxpeople"><p class="hint" style="grid-column:1/-1">読み込み中…</p></div>
    <div id="pxAct" class="row" style="margin-top:10px;flex-wrap:wrap"></div>
    <div id="pxRes"></div>

  try{

}
function pxProg(msg){
  const el = $("#pxProg"); if(!el || !fx) return;
  if(msg){ el.innerHTML = `<div class="hint">${esc(msg)}</div>`; return; }
  if(fx.err){ el.innerHTML = `<div class="hint">⚠️ ${esc(fx.err)} <a href="#" id="pxRetry">もう一度</a></div>`; $("#pxRetry").onclick = e=>{ e.preventDefault(); fx.err = ""; runFaceScan(); }; return; }
  if(fx.running){ const pct = fx.todo ? Math.round(fx.done/fx.todo*100) : 0;
    el.innerHTML = `<div class="hint">写真を解析中… ${fx.done}/${fx.todo}枚(閉じても続きます)</div><div class="pxbar"><i style="width:${pct}%"></i></div>`; return; }
  el.innerHTML = `<div class="hint">アルバムの写真 ${fx.items.length}枚を解析ずみ</div>`;
}
async function runFaceScan(){
  if(!fx || fx.running) return;
  const g = fx.gid, todo = fx.items.filter(a=>!fx.faces[a.id]);
  if(!todo.length){ pxProg(); return; }
  fx.running = true; fx.todo = todo.length; fx.done = 0; fx.err = "";
  pxProg("顔認識の準備中…(初回だけ10MBほど読み込みます)");
  let fa;
  try{ fa = await loadFaceApi(); }
  catch(e){ fx.running = false; fx.err = "顔認識を読み込めませんでした。通信状況を確かめてください"; pxProg(); return; }
  const opt = new fa.SsdMobilenetv1Options({ minConfidence: 0.5 });
  for(const a of todo){
    if(!fx || fx.gid !== g || gid !== g) break;
    try{
      const p = await getDoc(doc(db,"groups",g,"albimg",a.id));
      const src = p.exists() ? p.data().data : a.thumb;
      const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; });
      const det = await fa.detectAllFaces(img, opt).withFaceLandmarks().withFaceDescriptors();
      const v = { at: Date.now(), faces: det.slice(0, 12).map(r=>({ d: Array.from(r.descriptor, x=>Math.round(x*1e4)/1e4), c: faceCrop(img, r.detection.box) })) };
      fx.faces[a.id] = v; await fdb.set(`f:${g}:${a.id}`, v);
    }catch(_){ /* 読めなかった写真は次回もう一度 */ }

    if(fx.done % 6 === 0) renderPeople();

  }

}
function renderPeople(){

  box.innerHTML = fx.cl.length
    ? main.map(card).join("") + (rest.length ? (fx.showRest ? rest.map(card).join("") : `<button class="pxp more" id="pxMore"><span style="font-size:22px;opacity:1">＋</span><b>1枚だけの人</b><span>${rest.length}人</span></button>`) : "")

function renderPeopleAct(){
  const el = $("#pxAct"); if(!el) return;

    + `<button class="btn s" id="pxClear">選択を解除</button>`;

  $("#pxName").onclick = async ()=>{

    startPick(p=>openForm(s, p||oldPos, keep), f.pos);
  };
  let exifPos = null;
  const attachFile = async (file)=>{
    f.file=file;
    const pv=$("#fPv"); try{ pv.src=URL.createObjectURL(file); pv.style.display="block"; }catch(_){}
    try{
      exifPos = readExifGps(await file.slice(0,256*1024).arrayBuffer());
      if(exifPos){
        const d = distM(exifPos, f.pos);
        if(d>30){
          $("#fPhotoMsg").innerHTML = `写真の撮影場所が、選んだ位置から約${Math.round(d)}m離れています。<button type="button" class="btn s" id="useExif" style="margin-top:6px;width:100%">写真の場所を使う</button>`;
          $("#useExif").onclick=()=>{ f.pos=exifPos; $("#fPosMsg").textContent="📍 写真の撮影場所"; $("#fPhotoMsg").textContent="✓ 写真の場所を使います"; };
        } else $("#fPhotoMsg").textContent="";
      }
    }catch(_){}
  };
  $("#fPhoto").addEventListener("change", e=>{ const file=e.target.files&&e.target.files[0]; if(file) attachFile(file); });
  if(st.file) attachFile(st.file);

    const name=$("#fName").value.trim();
    if(!name){ toast("お店の名前を入れてね"); $("#fName").focus(); return; }
    const btn=$("#fSave"); btn.disabled=true; btn.textContent="保存中…";
    try{
      let photos=null;
      if(f.file){ try{ photos = await makePhotos(f.file); }catch(_){ toast("この写真は読み込めませんでした(JPEGで試してね)"); btn.disabled=false; btn.textContent=edit?"更新する":"保存する"; return; } }
      const body = { name, genre:f.genre, rating:f.rating, visited:$("#fDate").value||"", note:$("#fNote").value.trim(),

        if(photos) await setDoc(doc(db,"groups",gid,"photos",s.id), { data:photos.full });
        closeSheet(); toast("更新しました");
      } else {
        body.createdBy=me.uid; body.createdAt=Date.now();
        if(!photos){ body.thumb=""; body.hasPhoto=false; }
        const ref = await addDoc(collection(db,"groups",gid,"spots"), body);
        if(photos) await setDoc(doc(db,"groups",gid,"photos",ref.id), { data:photos.full });
        closeSheet(); toast("記録しました🎉");
      }
    }catch(e){ toast(errMsg(e)); btn.disabled=false; btn.textContent=edit?"更新する":"保存する"; }
  };
}

// ---------- 👣 足あとタイム(1日5回の通知で1枚ずつ撮る → 21時に足あとアートになる) ----------
const VAPID_KEY = "BCZeVGl2Of9j-s7AkV-pTzlNxI5jdZMpRIvBJHzrftqg6IrsaaVH2EJDgGR8zeq2FRklMtcUTR4IJHVM24v4_1g";
const SLOTS = 5, ART_HOUR = 21;
const jstDate = (t=Date.now()) => new Date(t + 9*3600*1000).toISOString().slice(0,10);
const jstHour = (t=Date.now()) => new Date(t + 9*3600*1000).getUTCHours();
let daily = null, dailyDate = null, unsubDaily = null, reals = {}, realMarkers = [];
const myRealId = n => jstDate() + "_" + n + "_" + (me ? me.uid : "");
// 今の回(通知が届いた最新の回)。まだなら0
function curSlot(){
  if(!daily || daily.date!==jstDate() || !daily.slots) return 0;
  let n = 0; for(let i=1;i<=SLOTS;i++) if((daily.slots[i]||0) > 0) n = i;
  return n;
}
const postedSlot = n => !!(me && reals[myRealId(n)]);
const postedToday = () => !!(me && Object.values(reals).some(r=>r.uid===me.uid && r.date===jstDate()));
const artReady = () => !!((daily && daily.date===jstDate() && daily.art) || jstHour() >= ART_HOUR);
const slotActive = () => { const n = curSlot(); return !!(me && gid && n && !postedSlot(n) && !artReady()); };
function listenDaily(){
  const d = jstDate(); if(d === dailyDate && unsubDaily) return;
  if(unsubDaily){ try{unsubDaily()}catch(_){} }
  dailyDate = d; daily = null;
  unsubDaily = onSnapshot(doc(db,"daily",d), s=>{ daily = s.exists() ? s.data() : null; updateRealUI(); refreshRealSheet(); }, e=>{});
}
function stopDaily(){ if(unsubDaily){ try{unsubDaily()}catch(_){} unsubDaily=null; } daily=null; dailyDate=null; updateRealUI(); }
setInterval(()=>{ if(me && jstDate()!==dailyDate){ listenDaily(); drawReals(); } }, 60000);

function hhmm(t){ const d=new Date(t); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`; }
function mdText(date){ const m=/^\d{4}-(\d{2})-(\d{2})$/.exec(date||""); return m ? `${+m[1]}/${+m[2]}` : ""; }
const realHidden = r => r.date===jstDate() && me && r.uid!==me.uid && !postedToday() && !artReady();   // 今日1枚撮るまで(21時の発表までは)友達の写真はぼかす
const slotLabel = r => r.slot ? `👣 ${r.slot}回目` : "";

function drawReals(){
  realMarkers.forEach(m=>m.remove()); realMarkers=[];
  if(!me || (filter!=="all" && filter!=="real")) return;
  for(const r of Object.values(reals)){
    if(typeof r.lat!=="number" || typeof r.lng!=="number") continue;
    const el = document.createElement("div");
    el.innerHTML = `<div class="rpin"><div class="rpic${realHidden(r)?" blur":""}">${r.thumb?`<img src="${esc(r.thumb)}" alt="">`:""}</div><div class="rbadge">👣</div>${members[r.uid]?`<div class="mk-who">${avatarHTML(members[r.uid],22)}</div>`:""}<div class="plabel"><b>${esc(who(r.uid))}</b><span>${mdText(r.date)} ${hhmm(r.at)}</span></div></div>`;
    el.addEventListener("click", e=>{ e.stopPropagation(); openReal(r.id); });
    realMarkers.push(new maplibregl.Marker({ element: el, anchor:"center" }).setLngLat([r.lng, r.lat]).addTo(map));

}

    navigator.geolocation.getCurrentPosition(p=>res({ lat:p.coords.latitude, lng:p.coords.longitude }), ()=>res(null), { enableHighAccuracy:true, timeout:10000, maximumAge:30000 });
  });
}

// ---------- 🎨 足あとアート(その日のみんなの足あと＋写真を1枚の絵に) ----------
let artDate = null, artPts = [];
const shiftDate = (d, k) => jstDate(Date.parse(d + "T12:00:00+09:00") + k*86400000);
function dayData(d){
  const cells = {};   // uid -> Set(マス)
  const put = (u,k)=>{ (cells[u] = cells[u] || new Set()).add(k); };
  for(const t of Object.values(trails)) if(t.date===d) for(const k of (t.pts||[])) put(t.uid, String(k));
  spots.forEach(s=>{ if(s.visited===d && typeof s.lat==="number") put(s.createdBy, cellKey(s.lat,s.lng)); });
  const photos = Object.values(reals).filter(r=>r.date===d && typeof r.lat==="number").sort((a,b)=>a.at-b.at);
  photos.forEach(r=>put(r.uid, cellKey(r.lat,r.lng)));
  const mts = Object.values(meets).filter(M=>jstDate(M.at||0)===d && typeof M.lat==="number");
  mts.forEach(M=>[M.uid, ...(M.with||[])].forEach(u=>put(u, cellKey(M.lat,M.lng))));
  return { cells, photos, meets: mts };
}
const artLocked = d => d===jstDate() && !artReady();
const iJoined = d => { const dd = dayData(d); return !!(me && (dd.cells[me.uid] && dd.cells[me.uid].size)); };
function openArt(d){
  closeSheet();
  artDate = d || (artReady() ? jstDate() : shiftDate(jstDate(), -1));
  $("#artv").classList.add("show");
  drawArt();
}
function closeArt(){ const a=$("#artv"); if(a) a.classList.remove("show"); }
const loadImg = src => new Promise(res=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>res(null); i.src = src; });
async function drawArt(){
  const d = artDate, today = jstDate();
  $("#avDate").textContent = `${+d.slice(0,4)}.${+d.slice(5,7)}.${+d.slice(8,10)}${d===today?"(今日)":""}`;
  $("#avNext").disabled = d >= today;
  const cv = $("#avCanvas"), msg = $("#avMsg"), leg = $("#avLegend");
  const dd = dayData(d);
  const uids = Object.keys(dd.cells).filter(u=>dd.cells[u].size).sort((a,b)=>dd.cells[b].size-dd.cells[a].size);
  leg.innerHTML = ""; artPts = [];
  if(artLocked(d)){ cv.style.display="none"; msg.style.display="block"; msg.innerHTML = `🎨 今日の足あとアートは<b>21時</b>に完成します。<br>それまでに足あとタイムで撮ったり、アプリを開いて歩いたりしてね👣`; return; }
  if(d===today && !iJoined(d)){ cv.style.display="none"; msg.style.display="block"; msg.innerHTML = `🔒 今日の足あとがまだないので見られません。<br>アプリを開いて少し歩くか、写真を1枚撮ると見られます。`; return; }
  if(!uids.length){ cv.style.display="none"; msg.style.display="block"; msg.textContent = "この日の足あとはありません"; return; }
  msg.style.display="none"; cv.style.display="block";
  // 位置 → キャンバス座標
  const pts = [];
  uids.forEach(u=>dd.cells[u].forEach(k=>{ const [a,b]=k.split(",").map(Number); if(isFinite(a)&&isFinite(b)) pts.push([a,b]); }));
  artPts = pts;
  let la0=Math.min(...pts.map(p=>p[0])), la1=Math.max(...pts.map(p=>p[0])), lo0=Math.min(...pts.map(p=>p[1])), lo1=Math.max(...pts.map(p=>p[1]));
  const k = Math.cos((la0+la1)/2*Math.PI/180);
  const minSpan = 0.006; // 最低でも約600m四方
  if(la1-la0 < minSpan){ const c=(la0+la1)/2; la0=c-minSpan/2; la1=c+minSpan/2; }
  if((lo1-lo0)*k < minSpan){ const c=(lo0+lo1)/2; lo0=c-minSpan/2/k; lo1=c+minSpan/2/k; }
  const W = 1080, H = 1350, padX = 90, top = 230, bottom = 300, inX = padX + 80, inTop = top + 80, inBot = bottom + 110;   // 写真が見出し・凡例にかぶらないよう内側に余白
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  const sc = Math.min((W-2*inX)/((lo1-lo0)*k), (H-inTop-inBot)/(la1-la0));
  const ox = (W - (lo1-lo0)*k*sc)/2, oy = inTop + ((H-inTop-inBot) - (la1-la0)*sc)/2;
  const P = (lat,lng)=>[ox + (lng-lo0)*k*sc, oy + (la1-lat)*sc];
  // 背景(紙っぽく)
  x.fillStyle = "#fbf6ee"; x.fillRect(0,0,W,H);
  for(let i=0;i<1400;i++){ x.fillStyle = `rgba(150,120,90,${Math.random()*0.05})`; x.fillRect(Math.random()*W, Math.random()*H, 2, 2); }
  // 足あと(にじむ丸)
  const r50 = Math.max(26, 0.00045*sc);   // 約50m(広い範囲のときも見えるよう最低サイズあり)
  x.globalCompositeOperation = "multiply";
  uids.forEach(u=>{
    const col = memberColor(u);
    dd.cells[u].forEach(kk=>{ const [a,b]=kk.split(",").map(Number); const [px,py]=P(a,b);
      const g = x.createRadialGradient(px,py,0,px,py,r50*1.4); g.addColorStop(0, col+"99"); g.addColorStop(1, col+"00");
      x.fillStyle = g; x.beginPath(); x.arc(px,py,r50*1.4,0,Math.PI*2); x.fill(); });
  });
  x.globalCompositeOperation = "source-over";
  // 写真を時間順に線でつなぐ
  const byU = {}; dd.photos.forEach(r=>(byU[r.uid] = byU[r.uid] || []).push(r));
  Object.entries(byU).forEach(([u,list])=>{
    if(list.length < 2) return;
    x.strokeStyle = memberColor(u); x.lineWidth = 6; x.setLineDash([16,12]); x.lineCap = "round";
    x.beginPath(); list.forEach((r,i)=>{ const [px,py]=P(r.lat,r.lng); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke();
  });
  x.setLineDash([]);
  // 写真(丸く切り抜き)
  const sz = 120;
  for(const r of dd.photos){
    if(!r.thumb) continue;
    const im = await loadImg(r.thumb); if(!im) continue;
    const [px,py] = P(r.lat,r.lng);
    x.save(); x.shadowColor="rgba(0,0,0,.25)"; x.shadowBlur=14; x.fillStyle="#fff"; x.beginPath(); x.arc(px,py,sz/2+8,0,Math.PI*2); x.fill(); x.restore();
    x.strokeStyle = memberColor(r.uid); x.lineWidth = 6; x.beginPath(); x.arc(px,py,sz/2+5,0,Math.PI*2); x.stroke();
    x.save(); x.beginPath(); x.arc(px,py,sz/2,0,Math.PI*2); x.clip(); x.drawImage(im, px-sz/2, py-sz/2, sz, sz); x.restore();
    x.fillStyle="#3a2f28"; x.font="bold 26px sans-serif"; x.textAlign="center"; x.fillText(hhmm(r.at), px, py+sz/2+40);
  }
  for(const M of dd.meets){ const [px,py]=P(M.lat,M.lng); x.font="56px sans-serif"; x.textAlign="center"; x.fillText("👥", px, py+18); }
  // タイトル
  x.textAlign="left"; x.fillStyle="#3a2f28";
  x.font="bold 64px sans-serif"; x.fillText(`${+d.slice(5,7)}月${+d.slice(8,10)}日の足あと`, padX, 130);
  x.font="32px sans-serif"; x.fillStyle="#8a7d72"; x.fillText(`${gname || "AshiArt"} ・ ${uids.length}人 ・ 写真${dd.photos.length}枚`, padX, 185);
  // 凡例
  let ly = H - bottom + 70;
  uids.slice(0,6).forEach((u,i)=>{
    const col = memberColor(u), cx = padX + (i%2)*460, cy = ly + Math.floor(i/2)*62;
    x.fillStyle = col; x.beginPath(); x.arc(cx+16, cy-10, 16, 0, Math.PI*2); x.fill();
    x.fillStyle="#3a2f28"; x.font="bold 34px sans-serif"; x.fillText(`${i===0?"👑 ":""}${who(u)}`.slice(0,12), cx+46, cy);
    x.fillStyle="#8a7d72"; x.font="30px sans-serif"; x.fillText(`${dd.cells[u].size}マス`, cx+330, cy);
  });
  x.fillStyle="#c9bcae"; x.font="bold 30px sans-serif"; x.textAlign="right"; x.fillText("👣 AshiArt", W-padX, H-50);
  leg.innerHTML = uids.length ? `👑 いちばん歩いたのは <b>${esc(who(uids[0]))}</b>さん(${dd.cells[uids[0]].size}マス)${dd.meets.length?` ・ 👥 合流${dd.meets.length}回`:""}` : "";
}

// 通知の登録(iPhoneはホーム画面に追加したアプリからのみ)
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
let fcm = null;
async function enablePush(){
  if(isIOS && !isStandalone()){ toast("先に「ホーム画面に追加」して、そこから開いてね"); return; }
  if(typeof Notification==="undefined"){ toast("この端末・ブラウザは通知に対応していません"); return; }
  const perm = await Notification.requestPermission();   // ボタンを押した直後に確認画面を出す
  if(perm !== "granted"){ toast("通知が許可されませんでした(設定 → 通知 から変えられます)"); return; }
  try{
    if(!(await isSupported())){ toast("この端末は通知に対応していません"); return; }
    const reg = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
    fcm = fcm || getMessaging(app);
    const token = await getToken(fcm, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if(!token){ toast("通知の登録に失敗しました"); return; }
    const hb = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(token));
    const tid = [...new Uint8Array(hb)].slice(0,16).map(b=>b.toString(16).padStart(2,"0")).join("");
    await setDoc(doc(db,"users",me.uid,"push",tid), { token, createdAt: Date.now() });
    LS.set("omoide.push", tid);
    onMessage(fcm, ()=>{ listenDaily(); toast("👣 足あとタイム！ 下の帯から撮ってね"); });
    toast("🔔 通知をオンにしました");
  }catch(e){ toast("通知の登録に失敗しました(" + (e && (e.code||e.message) || e) + ")"); }
}
function pushStatusText(){
  if(isIOS && !isStandalone()) return "iPhoneでは、Safariの共有ボタン →「ホーム画面に追加」をして、ホーム画面のアイコンから開くと通知をオンにできます。";
  if(typeof Notification!=="undefined" && Notification.permission==="granted" && LS.get("omoide.push")) return "🔔 通知はオンです(毎日8〜21時に5回＋21時のアート発表)";
  return "毎日8〜21時に5回の「👣 足あとタイム」と、21時の「🎨 足あとアート」の通知が届きます。";
}

  const list = Object.entries(members).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));
  openSheet(`<h2>👥 ${esc(gname)}</h2>
    ${list.map(([id,m])=>`<div class="member" data-uid="${esc(id)}">${avatarHTML(m,36)}<div><b>${esc(m.nick||m.name)}</b>${id===me.uid?"(あなた)":""}<div class="hint" style="margin:0">${noteActive(m)?esc(m.note)+" ・ ":""}${spots.filter(s=>s.createdBy===id).length}件の記録</div></div></div>`).join("")}
    <label class="f">友達を招待</label>
    ${gcode ? `<div class="hint">合言葉：<b>${esc(gcode)}</b></div><div class="row"><button class="btn p" id="inv">招待メッセージを送る</button></div>`
            : `<div class="hint">この端末には合言葉が保存されていません。合言葉を知っている人に聞いてね。</div>`}
    <div class="row"><button class="btn s" id="mClose">閉じる</button></div>`);
  $("#mClose").onclick=closeSheet;
  $("#sheet").querySelectorAll(".member").forEach(r=>r.onclick=()=>openProfile(r.dataset.uid));
  if(gcode) $("#inv").onclick=async()=>{
    const text = `AshiArt「${gname}」に参加してね！\n${location.origin+location.pathname}\n合言葉：${gcode}\n(LINEで開いたら「ブラウザで開く」を選んでね)`;
    try{ if(navigator.share){ await navigator.share({ text }); return; } }catch(_){ return; }
    try{ await navigator.clipboard.writeText(text); toast("招待メッセージをコピーしました"); }catch(_){ toast("コピーできませんでした"); }
  };
};

// ---------- 設定 ----------
$("#bSettings").onclick = ()=>{
  openSheet(`<h2>⚙️ 設定</h2>
    <div class="row" style="margin-top:0"><button class="btn p" id="sProfile">👤 自分のプロフィール</button></div>
    <label class="f">アイコン(グループのみんなに表示されます)</label>
    <div style="display:flex;align-items:center;gap:14px">
      <span id="icPrev">${avatarHTML(myself(),72)}</span>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px">
        <label class="btn p" style="text-align:center">📷 写真を選ぶ<input type="file" id="icFile" accept="image/*" hidden></label>
        <button class="btn s" id="icEmojiBtn">😀 絵文字にする</button>
        <button class="btn s" id="icGoogle">Googleの写真に戻す</button>
      </div>
    </div>
    <div id="icEmojiPanel" style="display:none">
      <div class="icgrid" id="icEmojis">${EMOJIS.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join("")}</div>
      <div class="icgrid" id="icColors">${ICON_COLORS.map(c=>`<button type="button" data-c="${c}" style="background:${c}" aria-label="色 ${c}"></button>`).join("")}</div>
      <div class="row"><button class="btn p" id="icEmojiOk">この絵文字にする</button></div>
    </div>
    <label class="f">🔔 足あとタイムの通知</label>
    <div class="hint" id="pushStat">${pushStatusText()}</div>
    ${isIOS && !isStandalone() ? "" : `<div class="row" style="margin-top:8px"><button class="btn s" id="sPush">通知をオンにする</button></div>`}
    <label class="f">🏷️ グループのジャンル</label>
    <div id="sGenres">${customGenres.length ? customGenres.map(g=>`<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="flex:1">${esc(g.emoji)} ${esc(g.label)}</span>${g.createdBy===me.uid?`<button type="button" class="btn s" data-del="${esc(g.k)}" style="padding:6px 10px">削除</button>`:""}</div>`).join("") : `<div class="hint">まだありません。記録するときの「＋ 新しいジャンル」から追加できます。</div>`}</div>
    <label class="f">👣 歩いた道を足あとに残す</label>
    <div class="tabs2" id="trailSeg" style="margin-top:0"><button data-v="on">残す</button><button data-v="off">残さない</button></div>
    <div class="hint">アプリを開いている間に歩いた場所(約50mごと)を、参加しているグループの「足あとモード」に色として残します。</div>
    <label class="f">🌦 天気の演出</label>
    <div class="tabs2" id="wxSeg" style="margin-top:0"><button data-v="off">オフ</button><button data-v="soft">さりげなく</button><button data-v="strong">しっかり</button></div>
    <div class="hint">今いる場所の天気に合わせて、雨・雪・風などの雰囲気を画面にかぶせます(天気:Open-Meteo)。電池が気になるときはオフに。</div>
    <label class="f">現在地の共有</label>
    <div class="tabs2" id="shareSeg" style="margin-top:0">
      <button data-v="off">共有しない</button><button data-v="on">共有する</button><button data-v="fuzzy">あいまい</button>
    </div>
    <div class="hint">参加しているすべてのグループのメンバーに見えます。アプリを開いている間だけ更新され、閉じると最後の場所が「〇分前」付きで残ります。「あいまい」は約500m単位のだいたいの場所になります。</div>
    <div class="meta" style="margin-top:16px">ログイン中：${esc(me.displayName||"")}<br>グループ：${esc(gname)}</div>
    <div class="row"><button class="btn s" id="sSwitch">グループを切り替える</button></div>
    <div class="row"><button class="btn s" id="sOut">ログアウト</button></div>
    <p class="hint" style="margin-top:16px">地図：© OpenStreetMap contributors © OpenFreeMap</p>
    <div class="row"><button class="btn s" id="sClose">閉じる</button></div>`);
  $("#sClose").onclick=closeSheet;
  $("#sProfile").onclick=()=>openProfile(me.uid);
  $("#sSwitch").onclick=()=>openGroupSheet();
  $("#sOut").onclick=async ()=>{ closeSheet(); await clearMyLocs(); LS.del("omoide.gid"); LS.del("omoide.icon"); LS.del("omoide.share"); LS.del("omoide.profile"); signOut(auth); };

  $("#sGenres").onclick = async e=>{
    const b = e.target.closest("button[data-del]"); if(!b) return;
    const g = G[b.dataset.del]; if(!g || !confirm(`ジャンル「${g.label}」を削除しますか？\nこのジャンルの記録は「その他」として表示されます。`)) return;
    try{ await deleteDoc(doc(db,"groups",gid,"genres",g.k.slice(2))); b.parentElement.remove(); toast("削除しました"); }catch(err){ toast(errMsg(err)); }
  };
  if($("#sPush")) $("#sPush").onclick = async ()=>{ await enablePush(); const el=$("#pushStat"); if(el) el.textContent = pushStatusText(); };
  const markTrail = ()=>[...$("#trailSeg").children].forEach(b=>b.classList.toggle("on", b.dataset.v===(trailOn()?"on":"off")));
  markTrail();
  $("#trailSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; LS.set("omoide.trail", b.dataset.v); markTrail(); updateFootPanel(); };
  const markWx = ()=>[...$("#wxSeg").children].forEach(b=>b.classList.toggle("on", b.dataset.v===wxMode()));
  markWx();
  $("#wxSeg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; LS.set("omoide.wx", b.dataset.v); markWx(); wxStart(); if(b.dataset.v!=="off") fetchWx(); };
  const markShare = ()=>[...$("#shareSeg").children].forEach(b=>b.classList.toggle("on", b.dataset.v===shareMode()));
  markShare();
  $("#shareSeg").onclick = async e=>{
    const b = e.target.closest("button"); if(!b) return;
    LS.set("omoide.share", b.dataset.v); markShare();
    if(b.dataset.v==="off"){
      await clearMyLocs();
      toast("現在地の共有をやめました");
    } else {
      lastSent = { t:0, lat:0, lng:0 };
      startLocate(false); sendLoc(true);
      toast(b.dataset.v==="fuzzy" ? "だいたいの場所を共有します" : "現在地を共有します");
    }
  };
  const saveIcon = async (ic)=>{
    try{
      await setDoc(doc(db,"groups",gid,"members",me.uid), { icon: ic }, { merge:true });
      await Promise.all(Object.keys(myGroups).filter(g=>g!==gid).map(g=>setDoc(doc(db,"groups",g,"members",me.uid), { icon: ic }, { merge:true }).catch(()=>{})));
      LS.set("omoide.icon", JSON.stringify(ic));
      $("#icPrev").innerHTML = avatarHTML(myself(),72);
      drawMe(); toast("アイコンを変更しました");
    }catch(e){ toast(errMsg(e)); }
  };
  $("#icFile").addEventListener("change", async e=>{
    const file = e.target.files && e.target.files[0]; if(!file) return;
    try{
      const img = await loadImage(file);
      let data = toDataURL(img, 160, true, 0.8);
      if(data.length > 55000) data = toDataURL(img, 120, true, 0.7);
      await saveIcon({ type:"photo", data });
    }catch(_){ toast("この写真は読み込めませんでした(JPEGで試してね)"); }
  });
  $("#icGoogle").onclick = ()=>saveIcon({ type:"google" });
  const cur = myIconLS() || {};
  let pickE = cur.emoji || EMOJIS[0], pickC = cur.color || ICON_COLORS[1];
  const mark = ()=>{
    [...$("#icEmojis").children].forEach(b=>b.classList.toggle("on", b.dataset.e===pickE));
    [...$("#icColors").children].forEach(b=>b.classList.toggle("on", b.dataset.c===pickC));
  };
  $("#icEmojiBtn").onclick = ()=>{ $("#icEmojiPanel").style.display="block"; mark(); };
  $("#icEmojis").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; pickE=b.dataset.e; mark(); };
  $("#icColors").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; pickC=b.dataset.c; mark(); };
  $("#icEmojiOk").onclick = ()=>saveIcon({ type:"emoji", emoji:pickE, color:pickC });
};
</script>
</body>
</html>
