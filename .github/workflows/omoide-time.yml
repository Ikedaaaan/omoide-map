# 足あとタイム：1日5回(日本時間8〜21時)のランダムな時刻と、21時の足あとアート発表を、全員へ通知する
name: omoide-time

on:
  schedule:
    # 日本時間 8:00〜21:50 の間、10分おきに起動(UTCで23時〜12時台)
    - cron: "*/10 23,0-12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "今すぐ次の足あとタイムを送る(テスト用)"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/omoide-time.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ inputs.force }}
